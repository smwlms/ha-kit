# User-facing texts of the module appliances-home-connect, one key per text: {en: ..., nl: ...}. Used in the module's
# files as <@ t('key') @> (tools/fill.py picks house.language, default en). {name} in a text is replaced at fill time
# when t() gets that keyword argument; otherwise Home Assistant fills it in at run time with | replace('{x}', value).
# Texts are inserted with | tojson: any character is allowed.

