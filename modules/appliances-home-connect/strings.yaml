error_actionrequired: { en: "{name} asks for an action (e.g. water, salt or the door). Look at the display.", nl: "{name} vraagt een actie (bv. water, zout of de deur). Kijk op het display." }
error_aborting: { en: "{name} is aborting the program.", nl: "{name} breekt het programma af." }
notify_done_title: { en: "{name} is done", nl: "{name} is klaar" }
notify_done_message: { en: "{program} finished at {time}. Time to take out {contents}.", nl: "{program} is klaar om {time}. Tijd om {contents} eruit te halen." }
notify_reminder_title: { en: "{name}: door still closed", nl: "{name}: deur nog dicht" }
notify_reminder_message:
