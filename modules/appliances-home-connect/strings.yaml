notify_offer_title: { en: "{name}: start?", nl: "{name} starten?" }
notify_offer_message:
  en: "{program} is ready. Smart start = sun or battery first, otherwise the best moment to be done by {deadline}."
  nl: "{program} staat klaar. Slim starten = zon of batterij eerst, anders het beste moment om klaar te zijn tegen {deadline}."
notify_cancelled_title: { en: "{name}: smart start cancelled", nl: "{name}: slim starten geannuleerd" }
notify_cancelled_message:
  en: "The door was opened. Close it and tap Smart start again (or switch the appliance on again when it plans by itself)."
  nl: "De deur ging open. Sluit ze en tik opnieuw op Slim starten (of zet het toestel opnieuw aan als het zelf plant)."
notify_door_title: { en: "{name}: door open", nl: "{name}: deur staat open" }
notify_door_message:
  en: "The door has been open for 2 min while the program is busy ({status}). Close the door so the program can go on."
  nl: "De deur staat al 2 min open terwijl het programma bezig is ({status}). Sluit de deur zodat het programma verder kan."
notify_error_title: { en: "{name}: {status}", nl: "{name}: {status}" }
