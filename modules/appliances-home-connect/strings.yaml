# --- Scripts ---
notify_alias: { en: "Appliances: notification", nl: "Toestellen: melding" }
notify_description:
  en: "Notification of the appliances through script.send_notification: to who is home, everyone when nobody is home. The tag replaces an earlier notification of the same appliance."
  nl: "Melding van de toestellen via script.send_notification: naar wie thuis is, naar iedereen als niemand thuis is. De tag vervangt een vorige melding van hetzelfde toestel."
start_now_alias: { en: "Appliances: start the selected program", nl: "Toestellen: geselecteerd programma starten" }
start_now_description:
  en: "Starts the program selected on the appliance through Home Connect, now or with a delay (start_in seconds). Turns smart waiting off and reports whether it worked. Start now on a delayed start cancels the delay on the appliance first."
  nl: "Start het op het toestel geselecteerde programma via Home Connect, meteen of met uitstel (start_in seconden). Zet slim wachten uit en meldt of het lukte. Nu starten op een uitgestelde start annuleert eerst het uitstel op het toestel."
smart_start_alias: { en: "Appliances: smart start (sun or battery first, else the best moment)", nl: "Toestellen: slim starten (zon of batterij eerst, anders het beste moment)" }
smart_start_description:
  en: "Plans the selected program so it is done by the ready-by time of the appliance (an hour, or auto = the learned arrival). Sun expected before the latest start: wait for surplus or a full battery, at the latest at the sunniest moment. Otherwise a delayed start on the cheapest quarter (with a tariff module) or as late as possible."
  nl: "Plant het geselecteerde programma zodat het klaar is tegen het klaar-tegen-uur van het toestel (een uur, of auto = de geleerde thuiskomst). Zon verwacht vóór de laatste start: wachten op overschot of een volle batterij, uiterlijk op het zonnigste moment. Anders een uitgestelde start op het goedkoopste kwartier (met een tariefmodule) of zo laat mogelijk."
field_appliance: { en: "Appliance", nl: "Toestel" }
field_start_in: { en: "Start in", nl: "Start over" }
field_start_in_description: { en: "seconds; 0 = now", nl: "seconden; 0 = meteen" }
field_reason: { en: "Reason", nl: "Reden" }
field_title: { en: "Title", nl: "Titel" }
field_message: { en: "Message", nl: "Bericht" }
field_tag: { en: "Tag", nl: "Tag" }
field_tag_description: { en: "a notification with the same tag replaces the previous one", nl: "een melding met dezelfde tag vervangt de vorige" }
field_actions: { en: "Buttons", nl: "Knoppen" }
field_actions_description: { en: "optional notification buttons: [{action, title}]", nl: "optionele meldingsknoppen: [{action, title}]" }

# --- Automations ---
offer_alias: { en: "Appliances: plan by itself or offer a smart start", nl: "Toestellen: zelf plannen of slim starten voorstellen" }
offer_description:
  en: "smart_start auto: switched on, door closed and remote start on for 2 min = plan by itself (script.appliance_smart_start). smart_start ask: remote start switched on = a notification with the buttons Smart start and Start now."
  nl: "smart_start auto: aan, deur dicht en Start op afstand 2 min aan = zelf plannen (script.appliance_smart_start). smart_start ask: Start op afstand aangezet = een melding met de knoppen Slim starten en Nu starten."
run_alias: { en: "Appliances: carry out a smart start", nl: "Toestellen: slim starten uitvoeren" }
run_description:
  en: "For appliances in smart waiting: start on solar surplus, or on a full home battery while the panels give at least 1 kW; otherwise at the planned moment (safety net). Cancels when the door opens or the appliance is started by hand."
  nl: "Voor toestellen in slim wachten: start bij zonne-overschot, of bij een volle thuisbatterij terwijl de panelen minstens 1 kW leveren; anders op het geplande moment (vangnet). Annuleert als de deur opengaat of het toestel met de hand start."
buttons_alias: { en: "Appliances: notification buttons", nl: "Toestellen: meldingsknoppen afhandelen" }
buttons_description: { en: "Handles the buttons Smart start and Start now of the appliance notifications.", nl: "Verwerkt de knoppen Slim starten en Nu starten uit de toestelmeldingen." }
door_alias: { en: "Appliances: door open during a program", nl: "Toestellen: deur open tijdens programma" }
door_description: { en: "Notification when the door has been open for 2 min while a program runs, pauses or waits for its delayed start.", nl: "Melding als de deur 2 min openstaat terwijl een programma loopt, gepauzeerd is of uitgesteld wacht." }
error_alias: { en: "Appliances: error or action required", nl: "Toestellen: fout of actie vereist" }
error_description: { en: "Notification when an appliance reports an error, asks for an action or aborts a program.", nl: "Melding als een toestel een fout meldt, een actie vraagt of een programma afbreekt." }
done_alias: { en: "Appliances: done + door reminder", nl: "Toestellen: klaar-melding + deurherinnering" }
done_description: { en: "Notification when an appliance is done; while the door stays closed a reminder every 30 min (at most 3). Stops as soon as the door opens.", nl: "Melding als een toestel klaar is; blijft de deur dicht, dan elke 30 min een herinnering (max 3). Stopt zodra de deur opengaat." }
maintenance_alias: { en: "Appliances: maintenance (salt, rinse aid, i-Dos, machine care)", nl: "Toestellen: onderhoud (zout, glansspoelmiddel, i-Dos, machinereiniging)" }
maintenance_description: { en: "Notification when an appliance asks for salt, rinse aid, machine care or an i-Dos refill, or when a program was aborted.", nl: "Melding als een toestel zout, glansspoelmiddel, een machinereiniging of i-Dos vraagt, of als een programma afgebroken werd." }

