  en: "Starts on solar surplus or a full battery ({kwh} kWh of sun expected), at the latest {time}. Done by {deadline}. Rather now? Tap Start now."
  nl: "Start bij zonne-overschot of een volle batterij ({kwh} kWh zon verwacht), uiterlijk {time}. Klaar tegen {deadline}. Liever meteen? Tik op Nu starten."
