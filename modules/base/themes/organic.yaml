# Theme "Organic" (cream and sand, terracotta and sage, Caprasimo/Figtree, generous rounding), tuned by hand.
# Light = Organic cream, dark = the warm dark of the custom screens. It is also the source of the fonts and shapes of
# every generated theme (tools/build_themes.py); its colours are checked by the same contrast test.
# The cw-* tokens are the only colour source for the kit's own cards (home, energy, climate, results, tesla).
# The theme name comes from strings.yaml (theme_name_organic). Deployed by modules/base/deploy.py to
# /config/themes/organic.yaml (needs frontend: themes: !include_dir_merge_named themes).
<@ t('theme_name_organic') @>:
  ha-font-family-body: "Figtree, system-ui, sans-serif"
  primary-font-family: "Figtree, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "Figtree, system-ui, sans-serif"
  ha-font-family-heading: "Caprasimo, Figtree, serif"
  ha-card-border-radius: "24px"
  ha-card-border-width: "0px"
  ha-dialog-border-radius: "28px"
  ha-badge-border-radius: "999px"
  feature-border-radius: "999px"
  control-select-border-radius: "999px"
  ha-button-border-radius: "999px"
  mdc-shape-small: "999px"
  mdc-shape-medium: "16px"
  mdc-shape-large: "28px"
  ha-tab-padding-start: "8px"
  ha-tab-padding-end: "8px"
  modes:
    light:
      # --- design tokens (cw-*) ---
      cw-bg: "#F5EAD8"
      cw-card: "#EBDDC5"
      cw-raised: "#F9F3EA"
      cw-line: "#D8C6A8"
      cw-text: "#201E1D"
      cw-muted: "#645C50"
      cw-accent: "#C67139"
      # Accent for icons and small text: ≥ 4.5:1 on card and page (low vision); fills keep cw-accent.
      cw-accent-ink: "#84502E"
      cw-on-accent: "#201E1D"
      cw-good: "#41692F"
      cw-warn: "#7E5409"
      cw-bad: "#A63B28"
      cw-zon: "#E8A571"
      cw-batterij: "#7F8B64"
      cw-net: "#BB7644"
      cw-huis: "#F5C9AE"
      cw-injectie: "#874B22"
      cw-wagen: "#AEBF92"
      cw-water: "#4F7F92"
      energy-solar-color: "#E8A571"
      energy-grid-consumption-color: "#BB7644"
      energy-grid-return-color: "#874B22"
      energy-battery-out-color: "#7F8B64"
      energy-battery-in-color: "#7F8B64"
      energy-non-fossil-color: "#AEBF92"
      # --- HA base ---
      # HA also uses primary-color as text (links, text buttons): the ink tone, ≥ 4.5:1 (fill #C67139 was 3.2:1).
      primary-color: "#84502E"
      # Sage accent (badges, links) at ≥ 4.5:1 on card and page.
      accent-color: "#586145"
      rgb-primary-color: "132, 80, 46"
      rgb-accent-color: "88, 97, 69"
      primary-background-color: "#F5EAD8"
      secondary-background-color: "#EEE7DB"
      card-background-color: "#EBDDC5"
      ha-card-background: "#EBDDC5"
      ha-card-box-shadow: "0 1px 2px rgba(46, 43, 37, 0.14)"
      primary-text-color: "#201E1D"
      secondary-text-color: "#645C50"
      disabled-text-color: "#A19786"
      divider-color: "rgba(32, 30, 29, 0.16)"
      state-icon-color: "#635C51"
      app-header-background-color: "#F5EAD8"
      app-header-text-color: "#201E1D"
      sidebar-background-color: "#EEE7DB"
      sidebar-text-color: "#474238"
      sidebar-icon-color: "#635C51"
      sidebar-selected-icon-color: "#84502E"
      sidebar-selected-text-color: "#201E1D"
      # Text on HA's primary/accent fills (filled buttons, sidebar badge).
      text-primary-color: "#FFFFFF"
      text-accent-color: "#FFFFFF"
      switch-checked-color: "#C67139"
      input-fill-color: "#F9F4ED"
      # Status colours: covers in sage, toggles/switches in terracotta instead of HA purple/amber; all icons
      # ≥ 4.5:1 on the card (low vision), "off" in the muted brown instead of HA's light grey (1.4:1).
      state-cover-active-color: "#586145"
      state-active-color: "#84502E"
      state-switch-active-color: "#84502E"
      state-inactive-color: "#635C51"
      # "Off" / closed tiles (HA tile + Mushroom template use --disabled-color): muted brown instead of 189,189,189 (1.4:1).
      disabled-color: "#635C51"
      # Unavailable devices: the "off" tone instead of disabled-text-color (2.2:1); the tile text says why.
      state-unavailable-color: "#635C51"
    dark:
      # --- design tokens (cw-*) ---
      cw-bg: "#1d1a17"
      cw-card: "#2a2622"
      cw-raised: "#3a3530"
      cw-line: "#4a433c"
      cw-text: "#F5EAD8"
      cw-muted: "#BFB3A1"
      cw-accent: "#D67F48"
      cw-accent-ink: "#DA8C59"
      cw-on-accent: "#1d1a17"
      cw-good: "#6FBF73"
      cw-warn: "#E8B04A"
      # Red ≥ 4.5:1 also on the raised surface (was #E36B5A: 3.8:1 there).
      cw-bad: "#EE8575"
      # Energy palette: same as light, but injectie gets a light tan (the dark brown is < 3:1 on the card).
      cw-zon: "#E8A571"
      cw-batterij: "#7F8B64"
      cw-net: "#BB7644"
      cw-huis: "#F5C9AE"
      cw-injectie: "#D9B48F"
      cw-wagen: "#AEBF92"
      cw-water: "#8FB8C9"
      energy-solar-color: "#E8A571"
      energy-grid-consumption-color: "#BB7644"
      energy-grid-return-color: "#D9B48F"
      energy-battery-out-color: "#7F8B64"
      energy-battery-in-color: "#7F8B64"
      energy-non-fossil-color: "#AEBF92"
      # --- HA base: identical to the custom screens so native views and own cards look the same ---
      # The ink tone, also as text ≥ 4.5:1 on the raised surface (#D67F48 was 4.0:1 there).
      primary-color: "#DA8C59"
      accent-color: "#AEBF92"
      rgb-primary-color: "218, 140, 89"
      rgb-accent-color: "174, 191, 146"
      primary-background-color: "#1d1a17"
      secondary-background-color: "#24201c"
      card-background-color: "#2a2622"
      ha-card-background: "#2a2622"
      ha-card-box-shadow: "none"
      primary-text-color: "#F5EAD8"
      secondary-text-color: "#BFB3A1"
      disabled-text-color: "#82796A"
      divider-color: "#3a3530"
      state-icon-color: "#BFB3A1"
      app-header-background-color: "#1d1a17"
      app-header-text-color: "#F5EAD8"
      sidebar-background-color: "#171512"
      sidebar-text-color: "#EEE7DB"
      sidebar-icon-color: "#A89E8D"
      sidebar-selected-icon-color: "#DA8C59"
      sidebar-selected-text-color: "#F5EAD8"
      # Text on HA's primary/accent fills: dark, white on the light fills was 2.9 / 2.0:1.
      text-primary-color: "#1d1a17"
      text-accent-color: "#1d1a17"
      switch-checked-color: "#D67F48"
      input-fill-color: "#3a3530"
      state-cover-active-color: "#AEBF92"
      state-active-color: "#DA8C59"
      state-switch-active-color: "#DA8C59"
      # "Off" icons ≥ 4.5:1 instead of HA's dark grey (1.3:1 on the card).
      state-inactive-color: "#A59F95"
      disabled-color: "#A59F95"
      state-unavailable-color: "#A59F95"
