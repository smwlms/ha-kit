# Palettes of the generated themes (every theme next to Organic). tools/build_themes.py --write turns each entry into
# themes/<id>.yaml; Organic itself (themes/organic.yaml) is tuned by hand and gives the fonts and shapes of every theme.
#
# A palette per mode (light, dark), all colours as #RRGGBB:
#   bg      page                     card    card                  raised  lifted surface (light: lighter than card)
#   line    lines                    text    text                  muted   secondary text, "off" icons
#   accent  fills (buttons, switches)                              ink     accent for icons and small text (>= 4.5:1)
#   "on"    text on an accent fill (quoted: YAML 1.1 reads a bare on as true)   second  companion colour (HA accent-color, open covers)
#   good / warn / bad  status        side    sidebar background
# A new theme: add an entry here, a name in ../strings.yaml (theme_name_<id>, en + nl), the id in ../_themes.jinja
# (theme_ids), then run build_themes.py --write. The check must pass (every text and icon >= 4.5:1).

# Energy palette per mode: the same for every theme, so a flow keeps its colour whoever is looking.
# Names are the cw-* token names (--cw-zon, ...; Dutch on purpose, see CONTRIBUTING.md "Known naming leftovers").
energy:
  light: { zon: "#E8A571", batterij: "#7F8B64", net: "#BB7644", huis: "#F5C9AE", injectie: "#874B22", wagen: "#AEBF92", water: "#4F7F92" }
  dark: { zon: "#E8A571", batterij: "#7F8B64", net: "#BB7644", huis: "#F5C9AE", injectie: "#D9B48F", wagen: "#AEBF92", water: "#8FB8C9" }

