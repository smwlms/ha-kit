# User-facing texts of the module charger-zappi, one key per text: {en: ..., nl: ...}. Used as <@ t('key') @>.
# Rules: no double quotes or backslashes (the texts sit between double quotes in YAML); placeholders like {mode}
# without a value at fill time stay in the text and are filled in by Home Assistant at run time (replace()); keep
# them when you translate; no emoji.

