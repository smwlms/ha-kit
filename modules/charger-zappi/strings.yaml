# --- script ev_charger_set_mode (scripts.yaml) ---
script_alias: { en: "EV charger: set mode", nl: "Laadpaal: modus zetten" }
script_description:
  en: >-
    Adapter of the ev-charger capability for the myenergi Zappi. solar_only = Eco+, solar_min = Eco, fast = Fast,
    stop = Stopped; solar_share sets the Minimum Green Level. Only ev-charging calls this script; it decides when to
    charge, this script only translates. Waits up to 60 s until the cloud confirms.
  nl: >-
    Adapter van de ev-charger-capability voor de myenergi Zappi. solar_only = Eco+, solar_min = Eco, fast = Fast,
    stop = Stopped; solar_share zet het Minimum Green Level. Alleen ev-charging roept dit script aan; die beslist
    wanneer er geladen wordt, dit script vertaalt enkel. Wacht tot 60 s tot de cloud bevestigt.
field_mode_name: { en: Mode, nl: Modus }
field_mode_description:
  en: "solar_only (only surplus), solar_min (surplus with a minimum from the grid), fast or stop"
  nl: "solar_only (enkel overschot), solar_min (overschot met een minimum van het net), fast of stop"
field_share_name: { en: Solar share, nl: Aandeel zon }
field_share_description:
  en: "Optional, 0-100: share of the charge power that must be surplus (Zappi Minimum Green Level)"
  nl: "Optioneel, 0-100: aandeel van het laadvermogen dat overschot moet zijn (Minimum Green Level van de Zappi)"
field_reason_name: { en: Reason, nl: Reden }
field_reason_description: { en: "Why, for the logbook", nl: "Waarom, voor het logboek" }
field_reason_example: { en: solar surplus, nl: zonne-overschot }

