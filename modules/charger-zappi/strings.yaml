# --- automation charger_zappi_phases (automations.yaml) ---
auto_phases_alias: { en: "EV charger: 1 or 3 phases by surplus", nl: "Laadpaal: 1 of 3 fasen volgens overschot" }
auto_phases_description:
  en: >-
    Only in solar_only (Eco+) with the phase switch on: 3 phases when binary_sensor.charger_zappi_three_phase_wanted
    is on (surplus above the high threshold for 10 min, battery not discharging and not behind) and the phase has
    been 1 or auto for 15 min; 1 phase as soon as it turns off. Back to auto in fast or solar_min and when the switch
    turns off. Stop is left alone. Never changes the charge mode. See charger-zappi/LOGIC.md.
  nl: >-
    Alleen in solar_only (Eco+) met de faseschakelaar aan: 3 fasen als binary_sensor.charger_zappi_three_phase_wanted
    aan staat (overschot 10 min boven de hoge drempel, batterij ontlaadt niet en loopt niet achter) en de fase al
    15 min op 1 of auto staat; 1 fase zodra hij uit gaat. Terug op auto in fast of solar_min en als de schakelaar
    uit gaat. Stop blijft ongemoeid. Wijzigt nooit de laadmodus. Zie charger-zappi/LOGIC.md.
log_phase_auto: { en: "phases back to auto ({mode})", nl: "fasen terug op auto ({mode})" }
log_phase_switch_off: { en: "phase switching off: phases back to auto", nl: "fasen niet meer automatisch: terug op auto" }
log_phase_three: { en: "3 phases, {kw} kW available", nl: "3 fasen, {kw} kW beschikbaar" }
log_phase_one: { en: "1 phase, {why}", nl: "1 fase, {why}" }
why_discharge: { en: battery feeds the car, nl: batterij voedt de wagen }
why_behind: { en: battery behind, nl: batterij loopt achter }
why_low: { en: "{kw} kW available", nl: "{kw} kW beschikbaar" }
why_no_data: { en: no available-power value, nl: geen waarde voor beschikbaar vermogen }
