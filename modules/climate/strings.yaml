# User-facing texts of the module climate: one key per text, {en: ..., nl: ...}. tools/fill.py picks house.language
# (default en). Helper, sensor and automation names and logbook lines are filled in by t() in the module's files;
# _climate_card.jinja passes every key the screen reads into the card config as strings:, and www/climate-screen.js
# reads them as S.<key>. {placeholders} stay in the text and are filled in by the card in the browser (fmt()) or by
# t(); keep them when you translate. Add a key here AND, for the screen, in string_keys of _climate_card.jinja.

