# --- automations: names, descriptions, logbook, notifications ---
auto_floor_choose_alias: { en: "Climate: choose the floor mode for the coming days", nl: "Klimaat: vloerstand kiezen voor de komende dagen" }
auto_floor_choose_description: { en: "Once a day at 06:00: cooling only when at least 3 days in a row are warm (forecast day maximum at or above the threshold), heating when 3 days in a row are cool, otherwise neutral. The indoor forecast vetoes the opposite mode. A mode stays at least 3 days and heating <-> cooling always passes through neutral. Daily peaks are for the ventilation, never for the floor. Off with input_boolean.climate_floor_mode_auto.", nl: "Elke dag om 06:00: koelen alleen als minstens 3 dagen na elkaar warm zijn (voorspeld dagmaximum op of boven de grens), verwarmen als 3 dagen na elkaar fris zijn, anders neutraal. De binnenprognose heeft een veto op de tegenovergestelde stand. Een stand blijft minstens 3 dagen en verwarmen <-> koelen gaat altijd via neutraal. Dagelijkse pieken zijn voor de ventilatie, nooit voor de vloer. Uit te zetten met input_boolean.climate_floor_mode_auto." }
auto_floor_apply_alias: { en: "Climate: apply the floor mode", nl: "Klimaat: vloerstand toepassen" }
auto_floor_apply_description: { en: "When the floor mode changes (by the daily decision or by hand), or a band of the active mode is tuned: writes the band of that mode through script.heat_pump_set_floor_band (the heat-pump module writes only values that differ) and stores the switch time in input_datetime.climate_floor_mode_since.", nl: "Als de vloerstand wijzigt (door de dagelijkse keuze of met de hand), of een band van de actieve stand bijgesteld wordt: schrijft de band van die stand via script.heat_pump_set_floor_band (de warmtepompmodule schrijft enkel waarden die verschillen) en bewaart het moment in input_datetime.climate_floor_mode_since." }
auto_ventilation_cooling_alias: { en: "Climate: cool with outside air", nl: "Klimaat: koelen met buitenlucht" }
auto_ventilation_cooling_description: { en: "Cools as cheaply as possible: warm inside and at least 2 °C cooler outside opens the bypass and runs the ventilation harder (medium; high only between {start} and {end}, because high is loud). Warmer outside than inside, or getting too cool inside: the bypass closes so the heat exchanger keeps the indoor temperature. Otherwise the ventilation runs on its own. Not in the heating season. Off with input_boolean.climate_ventilation_cooling.", nl: "Koelt zo zuinig mogelijk: warm binnen en buiten minstens 2 °C koeler zet de bypass open en de ventilatie harder (midden; hoog alleen tussen {start} en {end}, want hoog is luid). Buiten warmer dan binnen, of binnen te fris: de bypass gaat dicht zodat de warmtewisselaar de binnentemperatuur vasthoudt. Anders regelt de ventilatie zichzelf. Niet in het stookseizoen. Uit te zetten met input_boolean.climate_ventilation_cooling." }
auto_season_profile_alias: { en: "Climate: ventilation profile by season", nl: "Klimaat: ventilatieprofiel volgens seizoen" }
auto_season_profile_description: { en: "Sets the temperature profile of the ventilation to its heating profile when the unit's own season detection reports the heating season, and to its cooling profile in the cooling season, so the bypass does not throw heat away in winter.", nl: "Zet het temperatuurprofiel van de ventilatie op het stookprofiel zodra de eigen seizoensdetectie van het toestel het stookseizoen meldt, en op het koelprofiel in het koelseizoen. Zo gooit de bypass in de winter geen warmte weg." }
auto_boost_alias: { en: "Climate: ComfoClime boost on a cold dip", nl: "Klimaat: ComfoClime bijverwarmen bij een korte koude piek" }
auto_boost_description: { en: "Indoor below {below} °C while the ComfoClime is not heating: it heats the supply air with boost for {hours} h (air warms up in minutes, the floor takes hours), then goes back to the mode it had. The previous mode is kept in input_text.climate_comfoclime_previous, so the way back survives a restart.", nl: "Binnen onder {below} °C terwijl de ComfoClime niet verwarmt: hij warmt de toevoerlucht op met boost, {hours} u lang (lucht warmt op in minuten, de vloer in uren), en gaat daarna terug naar zijn vorige stand. Die staat in input_text.climate_comfoclime_previous, zodat de terugweg ook een herstart overleeft." }
