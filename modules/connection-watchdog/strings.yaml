# User-facing texts of the module connection-watchdog: {key: {en: ..., nl: ...}}. In the module's files: t('key').
# {placeholders} are filled in by Home Assistant (sensor, automation) or by the card, never by fill.py.
language_code: { en: "en", nl: "nl" }
locale: { en: "en-GB", nl: "nl-BE" }
# Entities and helpers
sensor_name: { en: "Connections", nl: "Verbindingen" }
sensor_test_name: { en: "Connection watchdog test", nl: "Verbindingen test" }
helper_test_name: { en: "Connection watchdog: test source", nl: "Verbindingen: testbron" }
automation_alias: { en: "Connection watchdog: repair and notify", nl: "Verbindingen: herstellen en melden" }
automation_description:
  en: "Reads sensor.connection_watchdog. Reloads the config entries of a source that has been down for 'wait' min, at most 'max' times per outage, 'interval' min apart. Notifies once per outage after 'notify_after' min (other sources down long enough join the same notification), and quietly when a notified source is back for 5 min. Reports back with one event connection_watchdog_update per run. See connection-watchdog/LOGIC.md."
  nl: "Leest sensor.connection_watchdog. Herlaadt de config entries van een bron die al 'wait' min stuk is, hooguit 'max' keer per uitval, 'interval' min uit elkaar. Meldt één keer per uitval na 'notify_after' min (andere bronnen die lang genoeg stuk zijn gaan mee), en stil zodra een gemelde bron 5 min terug is. Meldt terug met één event connection_watchdog_update per run. Zie connection-watchdog/LOGIC.md."
