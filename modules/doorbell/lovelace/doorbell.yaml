<# Example dashboard section for the doorbell; not deployed automatically.
   Notification choices: one card per person with people[].user_id (only that user sees it), and an overview of
   everyone for the admins with a user_id (_doorbell.jinja: people[].admin among the recipients, none = the first
   recipient, the same people who get the garage safety notifications); without such an admin every user sees it. Hiding is not protection: see README, "Who gets a notification". #>
<% from '_doorbell.jinja' import recipients, admins with context %>
<% set parcel_service = 'parcel-service' in modules %>
<% set admin_users = admins | selectattr('user_id', 'defined') | selectattr('user_id') | map(attribute='user_id') | map('string') | list %>
# Example card doorbell: paste into a dashboard (Edit > Add card > Manual).
# On top the doorbell picture, below it the last visit, the reply buttons (LCD text for 3 min) and the visit list,
# then who gets a notification: your own choice, and everyone's for the admins.
type: vertical-stack
cards:
  - type: picture-entity
    entity: <@ entities.doorbell_camera @>
    name: <@ t('card_front_door') | tojson @>
    camera_view: auto # refreshing photo; live only after a tap (live loads slowly)
    show_state: false
  - type: tile
    entity: input_text.doorbell_visit
    name: <@ t('card_last_visit') | tojson @>
  - type: grid
    columns: <@ 3 if parcel_service else 2 @>
    square: false
    cards:
      - type: button
        name: <@ t('card_button_at_door') | tojson @>
        icon: mdi:door
        tap_action:
          action: perform-action
          perform_action: script.doorbell_reply
          data:
            button: at_door
<% if parcel_service %>
      - type: button
        name: <@ t('card_button_garage') | tojson @>
        icon: mdi:garage-open-variant
        tap_action:
          action: perform-action
          perform_action: script.doorbell_reply
          data:
            button: garage
          confirmation:
            text: <@ t('card_button_garage_confirm') | tojson @>
<% endif %>
      - type: button
        name: <@ t('button_coming') | tojson @>
        icon: mdi:walk
        tap_action:
          action: perform-action
          perform_action: script.doorbell_reply
          data:
            button: coming
  - type: custom:cw-bezoeken
    calendar: <@ doorbell.calendar @>
    visit: input_text.doorbell_visit
    days: 31
    limit: 8
<% for p in recipients if p.get('user_id') %>
  - type: conditional
    conditions:
      - condition: user
        users:
          - <@ p.user_id | string | tojson @>
    card:
      type: entities
      title: <@ t('card_my_notifications') | tojson @>
      entities:
        - entity: input_select.doorbell_<@ p.key @>_ring
          name: <@ t('card_ring') | tojson @>
<% if parcel_service %>
        - entity: input_select.doorbell_<@ p.key @>_parcel
          name: <@ t('card_parcel') | tojson @>
<% endif %>
<% endfor %>
<% if recipients %>
<% set overview %>
type: entities
title: <@ t('card_all_notifications') | tojson @>
entities:
<% for p in recipients %>
  - input_select.doorbell_<@ p.key @>_ring
<% if parcel_service %>
  - input_select.doorbell_<@ p.key @>_parcel
<% endif %>
<% endfor %>
<% endset %>
<% if admin_users %>
  - type: conditional
    conditions:
      - condition: user
        users: <@ admin_users | tojson @>
    card:
      <@ overview | trim | indent(6) @>
<% else %>
  - <@ overview | trim | indent(4) @>
<% endif %>
<% endif %>
