# User-facing texts of the module doorbell, one key per text: {en: ..., nl: ...}. Used in the module's files as
# <@ t('key') @> (tools/fill.py picks house.language, default en; a missing language falls back to en with a warning).
# {name} in a text is replaced at fill time when t() gets that keyword argument; otherwise it stays and Home
# Assistant (| replace('{name}', ...)) or the card (JavaScript) fills it in at run time.
# The texts used inside Home Assistant templates and in www/cw-bezoeken.js are inserted with | tojson: any
# character is allowed.

