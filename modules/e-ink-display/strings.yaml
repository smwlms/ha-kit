# User-facing texts of the module e-ink-display: one key per text, {en: ..., nl: ...}. tools/fill.py picks
# house.language (default en); _e_ink.jinja passes every key of string_keys into the card config as strings:, and
# www/e-ink-screen.js reads them as S.<key>. {placeholders} stay in the text and are filled in by the card (fmt());
# keep them when you translate. Add a key here AND in string_keys of _e_ink.jinja.

language_code: { en: en, nl: nl }
