<% from '_energy_plan.jinja' import battery with context %>
<# Helpers and the export average of the module. Uploaded by energy-plan/deploy.py to
   /config/packages/energy_plan.yaml. No `initial`: deploy.py sets the defaults of module.yaml once. #>
# Energy plan: helpers and the 10-minute export average (ha-kit module energy-plan, see energy-plan/LOGIC.md).
# Filled in from house.yaml by tools/fill.py: change house.yaml and deploy again, do not edit this file in HA.
input_number:
  energy_plan_surplus_kw: # surplus on above this + hysteresis, off below this - hysteresis
    name: <@ t('helper_surplus_kw') | tojson @>
    icon: mdi:solar-power-variant
    min: 0.1
    max: 10
    step: 0.1
    unit_of_measurement: kW
    mode: box
  energy_plan_surplus_hysteresis_kw:
    name: <@ t('helper_surplus_hysteresis_kw') | tojson @>
    icon: mdi:arrow-expand-vertical
    min: 0
    max: 3
    step: 0.1
    unit_of_measurement: kW
    mode: box
<% if battery %>
  energy_plan_battery_safety_kwh: # battery behind on below this margin
    name: <@ t('helper_battery_safety_kwh') | tojson @>
    icon: mdi:battery-clock
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: kWh
    mode: box
  energy_plan_battery_hysteresis_kwh: # ... and off only above safety + this
    name: <@ t('helper_battery_hysteresis_kwh') | tojson @>
    icon: mdi:arrow-expand-vertical
    min: 0
    max: 3
    step: 0.1
    unit_of_measurement: kWh
    mode: box
<% endif %>

# 10-minute time-weighted mean of the export in kW (sensor.energy_plan_export_kw, templates/energy_plan.yaml).
# The name stays English in every language: a statistics sensor gets its entity id from its name
# (sensor.energy_plan_export_avg is part of the contract). keep_last_sample: a steady value (0 at night) stays.
sensor:
  - platform: statistics
    name: "Energy plan export avg"
    unique_id: energy_plan_export_avg
    entity_id: sensor.energy_plan_export_kw
    state_characteristic: average_step
    sampling_size: 2000
    max_age:
      minutes: 10
    keep_last_sample: true
    precision: 2
