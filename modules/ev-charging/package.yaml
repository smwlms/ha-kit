<% from '_ev_charging.jinja' import has_tariff, battery, amps_cars, plan_cars, limit_cars, own_counter with context %>
<# Helpers of ev-charging -> /config/packages/ev_charging.yaml. No `initial`: deploy.py sets the defaults of
   module.yaml once, when a helper is new; afterwards the value is the user's. #>
# EV charging: helpers and the 10-minute available-power average (ha-kit module ev-charging, see
# ev-charging/LOGIC.md "Settings"). Filled in from house.yaml by tools/fill.py: change house.yaml and deploy again,
# do not edit this file in Home Assistant.
input_boolean:
  ev_charging_smart: # master switch: off = the kit leaves the charger alone
    name: <@ t('helper_smart') | tojson @>
    icon: mdi:car-electric
<% if has_tariff %>
  ev_charging_cheap_enabled: # grid assist in a cheap window (daytime, battery full, small grid draw)
    name: <@ t('helper_cheap_enabled') | tojson @>
    icon: mdi:cash-lock-open
<% endif %>
<% if amps_cars %>
  ev_charging_car_amps_auto: # the kit sets the car charge current (Teslemetry)
    name: <@ t('helper_car_amps_auto') | tojson @>
    icon: mdi:auto-fix
<% endif %>
<% for c in plan_cars %>
  ev_plan_<@ c.prefix @>: # charge plan of this car on/off (off = the plan is computed, not executed)
    name: <@ t('helper_plan', name=c.name) | tojson @>
    icon: mdi:car-clock
<% endfor %>

input_number:
  ev_charging_solar_share: # share of the charge power that must be surplus before the car starts (solar_only)
    name: <@ t('helper_solar_share') | tojson @>
    icon: mdi:leaf
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
<% if battery %>
  ev_charging_battery_floor: # below this home-battery level the battery may not feed the car at all
    name: <@ t('helper_battery_floor') | tojson @>
    icon: mdi:home-battery-outline
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
<% endif %>
<% if has_tariff %>
  ev_charging_cheap_max_grid_kw: # grid import allowed during the cheap window (total import of the house)
    name: <@ t('helper_cheap_max_grid') | tojson @>
    icon: mdi:transmission-tower-import
    min: 0
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
<% if battery %>
  ev_charging_cheap_battery_full: # the home battery counts as full from this level
    name: <@ t('helper_cheap_battery_full') | tojson @>
    icon: mdi:battery-high
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
<% endif %>
  ev_charging_cheap_stop_min: # minutes the assist may stay not allowed before it stops
    name: <@ t('helper_cheap_stop_min') | tojson @>
    icon: mdi:timer-sand
    min: 0
    max: 15
    step: 1
    unit_of_measurement: min
    mode: box
<% endif %>
<% if amps_cars %>
  ev_charging_min_amps: # lowest car charge current (below about 5 A a Tesla charges inefficiently)
    name: <@ t('helper_min_amps') | tojson @>
    icon: mdi:current-ac
    min: 1
    max: 16
    step: 1
    unit_of_measurement: A
    mode: slider
  ev_charging_car_commands_per_day: # daily budget of car commands on surplus (the plan may exceed it)
    name: <@ t('helper_commands_per_day') | tojson @>
    icon: mdi:counter
    min: 5
    max: 100
    step: 5
    mode: slider
<% endif %>
<% for c in plan_cars %>
  ev_plan_<@ c.prefix @>_target: # manual target in % (0 = none); back to 0 once the departure has passed
    name: <@ t('helper_plan_target', name=c.name) | tojson @>
    icon: mdi:battery-arrow-up
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  ev_plan_<@ c.prefix @>_margin: # extra on top of the trip consumption of calendar appointments
    name: <@ t('helper_plan_margin', name=c.name) | tojson @>
    icon: mdi:plus-circle-outline
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: slider
  ev_plan_<@ c.prefix @>_reserve: # battery left on arrival back home (calendar target)
    name: <@ t('helper_plan_reserve', name=c.name) | tojson @>
    icon: mdi:battery-lock
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: slider
  ev_plan_<@ c.prefix @>_solar_confidence: # share of the expected solar surplus the plan relies on
    name: <@ t('helper_plan_solar_confidence', name=c.name) | tojson @>
    icon: mdi:weather-sunny-alert
    min: 0
    max: 100
    step: 10
    unit_of_measurement: "%"
    mode: slider
<% if c.limit %>
  ev_plan_<@ c.prefix @>_previous_limit: # internal: the car's charge limit before the plan raised it (0 = not raised)
    name: <@ t('helper_plan_previous_limit', name=c.name) | tojson @>
    icon: mdi:battery-sync
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
<% endif %>
<% endfor %>

input_select:
  ev_charging_owner: # who owns the charger now; set by automation.ev_charging_apply (manual: until unplugged)
    name: <@ t('helper_owner') | tojson @>
    icon: mdi:account-key-outline
    options:
      - none
      - surplus
      - cheap
      - plan
      - manual
<% if plan_cars %>

input_datetime:
<% for c in plan_cars %>
  ev_plan_<@ c.prefix @>_departure: # departure (date and time) of the manual target
    name: <@ t('helper_plan_departure', name=c.name) | tojson @>
    icon: mdi:car-clock
    has_date: true
    has_time: true
<% endfor %>
<% endif %>
<% if own_counter %>

counter:
  # Tesla commands sent today (Teslemetry credits); reset at midnight by automation.ev_charging_tesla_counter_reset.
  # Defined here only because the module gate is not installed (it owns this counter, same id and meaning).
  tesla_commands_today:
    name: <@ t('helper_tesla_commands_today') | tojson @>
    icon: mdi:counter
    restore: true
<% endif %>

# 10-minute time-weighted mean of sensor.ev_charging_available_power (W). The name stays English in every language:
# a statistics sensor gets its entity id from its name (sensor.ev_charging_available_power_avg is part of the
# contract; charger-zappi switches phases on it). keep_last_sample: a steady value stays.
sensor:
  - platform: statistics
    name: "EV charging available power avg"
    unique_id: ev_charging_available_power_avg
    entity_id: sensor.ev_charging_available_power
    state_characteristic: average_step
    sampling_size: 2000
    max_age:
      minutes: 10
    keep_last_sample: true
    precision: 0
