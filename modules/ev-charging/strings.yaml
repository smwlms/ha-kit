# --- script ev_charging_manual_mode (scripts.yaml) ---
script_manual_alias: { en: "Smart charging: charger mode by hand", nl: "Slim laden: laadpaalmodus met de hand" }
script_manual_description:
  en: >-
    Sets the charger to a mode by hand (screens, buttons). Fires ha_kit_ev_charging_manual; the automation
    ev_charging_apply sets the owner to manual and the charger to this mode, and leaves it alone until the car is
    unplugged (or the owner is set back to none). Without smart charging on it only sets the mode.
  nl: >-
    Zet de laadpaal met de hand in een modus (schermen, knoppen). Vuurt ha_kit_ev_charging_manual; de automation
    ev_charging_apply zet de eigenaar op manual en de laadpaal in deze modus, en laat hem met rust tot de auto
    uitgeplugd wordt (of de eigenaar weer op none staat). Met slim laden uit zet hij enkel de modus.
field_manual_mode_name: { en: Mode, nl: Modus }
field_manual_mode_description: { en: "solar_only, solar_min, fast or stop", nl: "solar_only, solar_min, fast of stop" }
field_manual_share_name: { en: "Solar share", nl: "Aandeel zon" }
field_manual_share_description: { en: "optional: share of the charge power that must be surplus (solar_only); empty = unchanged", nl: "optioneel: aandeel van het laadvermogen dat overschot moet zijn (solar_only); leeg = ongewijzigd" }
field_manual_reason_name: { en: Reason, nl: Reden }
field_manual_reason_description: { en: "shown in the logbook", nl: "komt in het logboek" }
manual_reason_default: { en: "by hand", nl: "met de hand" }

# --- automation ev_charging_apply ---
auto_apply_alias: { en: "Smart charging: apply", nl: "Slim laden: uitvoeren" }
auto_apply_description:
  en: >-
    Carries out sensor.ev_charging_wanted: the only caller of script.ev_charger_set_mode and the only writer of
    input_select.ev_charging_owner. A change of the charger that the kit did not make sets the owner to manual until
    the car is unplugged. Master switch off: hands the charger back once in solar_only. See ev-charging/LOGIC.md.
  nl: >-
    Voert sensor.ev_charging_wanted uit: de enige die script.ev_charger_set_mode aanroept en
    input_select.ev_charging_owner zet. Zet iemand anders de laadpaal om, dan wordt de eigenaar manual tot de auto
    uitgeplugd wordt. Hoofdschakelaar uit: geeft de laadpaal een keer terug in solar_only. Zie ev-charging/LOGIC.md.
