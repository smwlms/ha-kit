    Start and end of the cheap window (daytime, with cheap power on), a charge plan that is not feasible, and at 21:00
    the evening before a departure. Through script.send_notification when the module notifications is installed,
    otherwise only in the logbook.
  nl: >-
    Begin en einde van het goedkope venster (overdag, met goedkope stroom aan), een laadplan dat niet haalbaar is, en om
    21:00 de avond voor een vertrek. Via script.send_notification als de module notifications geinstalleerd is,
    anders enkel in het logboek.
