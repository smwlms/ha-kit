# --- automation ev_charging_tesla_counter_reset (only without gate) ---
auto_counter_reset_alias: { en: "Tesla commands: reset at midnight", nl: "Tesla-commando's: op nul om middernacht" }
auto_counter_reset_description:
  en: >-
    Resets counter.tesla_commands_today at midnight. Only installed by ev-charging while the module gate (which owns the
    counter) is not installed.
  nl: >-
    Zet counter.tesla_commands_today om middernacht op nul. Enkel geinstalleerd door ev-charging zolang de module gate
    (eigenaar van de teller) niet geinstalleerd is.

