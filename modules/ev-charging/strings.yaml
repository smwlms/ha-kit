# --- automation ev_charging_car_amps ---
auto_amps_alias: { en: "Smart charging: car current", nl: "Slim laden: ampère van de auto" }
auto_amps_description:
  en: >-
    The only writer of the car charge current (Teslemetry). Charge plan in fast: the current that fits under the month
    peak. Fast by hand: the maximum. Surplus or cheap assist: the 10-minute available power divided by voltage x phases,
    within the minimum and the maximum, only on a difference, at least 10 min apart except a drop of 2 A or more, within
    the daily command budget (the plan may exceed it). Every command counts in counter.tesla_commands_today.
  nl: >-
    De enige die de laadstroom van de auto zet (Teslemetry). Laadplan in fast: de stroom die onder de maandpiek past.
    Fast met de hand: het maximum. Overschot of netbijstand: het beschikbare vermogen over 10 min gedeeld door spanning
    x fasen, tussen minimum en maximum, alleen bij verschil, minstens 10 min ertussen behalve bij een daling van 2 A of
    meer, binnen het dagbudget aan commando's (het laadplan mag erover). Elk commando telt in counter.tesla_commands_today.
log_amps: { en: "car current {from} -> {to} A · {why}", nl: "laadstroom {from} -> {to} A · {why}" }
why_amps_plan: { en: "charge plan within the month peak", nl: "laadplan binnen de maandpiek" }
why_amps_fast: { en: "fast: maximum", nl: "fast: maximum" }
why_amps_solar: { en: "{kw} kW available", nl: "{kw} kW beschikbaar" }

# --- automations ev_plan_<car>_limit and ev_plan_target_reset ---
auto_limit_alias: { en: "Charge plan {name}: charge limit", nl: "Laadplan {name}: laadlimiet" }
auto_limit_description:
  en: >-
    The only writer of the car's charge limit. A target above the limit raises the limit to the target (the old limit
    is kept in input_number.ev_plan_<car>_previous_limit); once there is no target any more (departure passed or plan
    off) and the car is online or plugged in, the old limit comes back. Every command counts in counter.tesla_commands_today.
  nl: >-
    De enige die de laadlimiet van de auto zet. Een doel boven de limiet zet de limiet op het doel (de oude limiet staat
    in input_number.ev_plan_<car>_previous_limit); zodra er geen doel meer is (vertrek voorbij of plan uit) en de auto
    online of ingeplugd is, komt de oude limiet terug. Elk commando telt in counter.tesla_commands_today.
logbook_plan: { en: "Charge plan {name}", nl: "Laadplan {name}" }
log_limit_raised: { en: "charge limit {to} % (was {from} %)", nl: "laadlimiet {to} % (was {from} %)" }
log_limit_restored: { en: "charge limit back to {to} %", nl: "laadlimiet terug op {to} %" }
auto_reset_alias: { en: "Charge plan: manual target back to 0 after departure", nl: "Laadplan: handmatig doel na vertrek terug op 0" }
auto_reset_description:
  en: >-
    A manual target counts until its departure; afterwards it goes back to 0 so an old target never starts charging again.
  nl: >-
    Een handmatig doel geldt tot zijn vertrek; daarna gaat het terug op 0, zodat een oud doel nooit opnieuw laden start.

# --- automation ev_charging_notify ---
