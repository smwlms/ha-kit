<% set relay = entities.gate_relay %>
<% set relay_domain = relay.split('.')[0] %>
<% set gate_sensor = entities.get('gate_sensor') %>
<% from '_gate.jinja' import camera, check_camera, dark, ai_value, ai_check with context %>
<% set phones = people | selectattr('phone', 'defined') | selectattr('phone') | list %>
# Gate: automations (ha-kit module gate, see gate/LOGIC.md).
# Written by gate/deploy.py through the config API (same as the automation editor).
# Cars and people come from custom_templates/gate.jinja (cars(), people()), filled in from house.yaml.
# Gate: <@ relay @> gives the pulse (script.gate_pulse is the adapter)<@ ', binary_sensor.gate_open is the end position (on = open)' if gate_sensor else '; no end-position sensor' @>.
# User-facing texts come from gate/strings.yaml (house.language) and sit in the variable `txt` of each automation;
# placeholders like {car} are filled in at run time with replace(): {car} = the name, {the_car} / {The_car} = the
# name with its article inside / at the start of a sentence (called / Called in cars()).

# --- 1. Automatic opening on approach ----------------------------------------------------------------------
- id: gate_auto_open
  alias: "<@ t('auto_open_alias') @>"
  description: >-
    <@ t('auto_open_description') @>
  mode: single
  max_exceeded: silent
  triggers:
    # The Teslas report every ~10 s while driving: the main trigger.
    - trigger: zone
      entity_id:
<% for a in cars %>
        - <@ car_entity(a, 'location') @>
<% endfor %>
      zone: zone.gate_approach
      event: enter
      id: car
<% if phones %>
    # Extra chance: a phone reports only every 20 s to 5 min, but always on entering a zone.
    - trigger: zone
      entity_id:
<% for x in phones %>
        - device_tracker.<@ x.phone @>
<% endfor %>
      zone: zone.gate_approach
      event: enter
      id: phone
<% endif %>
  conditions:
    - condition: state
      entity_id: input_boolean.gate_auto_open_enabled
      state: "on"
  actions:
    - alias: Let the template sensors update (they react to the same location update as this trigger)
      delay: "00:00:03"
    - variables:
        txt:
          logbook: "<@ t('auto_open_alias') @>"
          opens: "<@ t('log_opens') @>"
          test_mode: "<@ t('log_test_mode') @>"
          asks: "<@ t('log_asks') @>"
          not_opening: "<@ t('log_not_opening') @>"
          line: "<@ t('log_line') @>"
          no_car: "<@ t('log_no_car') @>"
          no_sensor: "<@ t('log_no_sensor') @>"
          car_line: "<@ t('log_car') @>"
          unknown: "<@ t('unknown') @>"
          joiner: "<@ t('and') @>"
          reason: "<@ t('reason_auto_open') @>"
          would_open: "<@ t('title_would_open') @>"
          opened: "<@ t('title_opened') @>"
          coming_home_who: "<@ t('message_coming_home_who') @>"
          coming_home: "<@ t('message_coming_home') @>"
          test_no_pulse: "<@ t('test_no_pulse') @>"
          close_gate: "<@ t('button_close_gate') @>"
          ask_title: "<@ t('title_ask_open') @>"
          ask_destination: "<@ t('message_ask_destination') @>"
          ask_no_navigation: "<@ t('message_ask_no_navigation') @>"
          ask_short_trip: "<@ t('message_ask_short_trip') @>"
        cooldown_min: 5
        car_list: "{% from 'gate.jinja' import cars %}{{ cars() | from_json }}"
        targets: "{% from 'gate.jinja' import recipients %}{{ recipients() | from_json }}"
        source: "{{ trigger.id | default('manual') }} {{ trigger.entity_id | default('') }}"
        # Cars in the approach zone, the triggering car first.
        in_zone: >
          {% set t = car_list | selectattr('loc', 'eq', trigger.entity_id | default('')) | map(attribute='p') | list %}
          {% set r = state_attr('zone.gate_approach', 'radius') | float(400) %}
          {% set ns = namespace(l=[]) %}
          {% for c in t + (car_list | map(attribute='p') | list) %}
            {% set m = state_attr('binary_sensor.gate_' ~ c ~ '_away_long_enough', 'gate_distance_m') %}
            {% if c not in ns.l and m is number and m <= r %}{% set ns.l = ns.l + [c] %}{% endif %}
          {% endfor %}
          {{ ns.l }}
        # A and C for the same car.
        ready_car: >
          {% set ns = namespace(c='') %}
          {% for c in in_zone if ns.c == ''
               and is_state('binary_sensor.gate_' ~ c ~ '_away_long_enough', 'on')
               and is_state('binary_sensor.gate_' ~ c ~ '_navigating_home', 'on') %}
            {% set ns.c = c %}
          {% endfor %}
          {{ ns.c }}
        c_ok: "{{ ready_car != '' }}"
        # A car in the zone that was away long enough (to ask when C is false), the triggering car first.
        away_car: >
          {% set ns = namespace(c='') %}
          {% for c in in_zone if ns.c == '' and is_state('binary_sensor.gate_' ~ c ~ '_away_long_enough', 'on') %}
            {% set ns.c = c %}
          {% endfor %}
          {{ ns.c }}
        # A car in the zone that navigates home (C) but was not away long enough (no A): a short trip. Asks too.
        nav_car: >
          {% set ns = namespace(c='') %}
          {% for c in in_zone if ns.c == '' and is_state('binary_sensor.gate_' ~ c ~ '_navigating_home', 'on') %}
            {% set ns.c = c %}
          {% endfor %}
          {{ ns.c }}
        # The car the question is about: away long enough without navigating home first, else the short trip.
        ask_car: "{{ away_car or nav_car }}"
        # Who is in it: phones moving with the car, else the usual driver (gate.jinja, riders).
        riders_text: >
          {% from 'gate.jinja' import riders %}
          {% set c = ready_car or ask_car %}
          {{ (riders(c) | from_json | join(' ' ~ txt.joiner ~ ' ')) if c else '' }}
        # The car the messages are about: ready, else the one asked about, else the first in the zone.
        msg_car: "{{ ready_car or ask_car or (in_zone | first | default('')) }}"
        car_name: "{{ car_list | selectattr('p', 'eq', msg_car) | map(attribute='name') | first | default('') }}"
        car_called: "{{ car_list | selectattr('p', 'eq', msg_car) | map(attribute='called') | first | default(car_name) }}"
        car_Called: "{{ car_list | selectattr('p', 'eq', msg_car) | map(attribute='Called') | first | default(car_name) }}"
        destination: >
          {% set b = state_attr('binary_sensor.gate_' ~ away_car ~ '_navigating_home', 'destination') if away_car else none %}
          {{ b if b not in [none, '', 'None', 'unknown', 'unavailable'] else '' }}
<% if gate_sensor %>
        # binary_sensor.gate_open: on = not fully closed. Unreachable still opens; only 'on' blocks.
        gate_state: "{{ states('binary_sensor.gate_open') }}"
<% else %>
        # No end-position sensor: the gate is assumed closed. A pulse on an open gate closes it (see LOGIC.md).
        gate_state: "{{ txt.no_sensor }}"
<% endif %>
        gate_ok: "{{ gate_state != 'on' and not is_state('<@ relay @>', 'on') }}"
        cooldown_ok: >
          {{ as_timestamp(now()) - (state_attr('input_datetime.gate_last_auto_open', 'timestamp') | float(0))
             >= cooldown_min * 60 }}
        test: "{{ is_state('input_boolean.gate_auto_open_dry_run', 'on') }}"
        opens: "{{ c_ok and gate_ok and cooldown_ok }}"
        # Ask instead of opening: a car that was away long enough approaches without navigating home (A without C),
        # or a car navigates home after a short trip (C without A).
        asks: "{{ not opens and cooldown_ok and gate_ok and ask_car != '' }}"
        details: >
          {% from 'gate.jinja' import riders %}
          {% set ns = namespace(t=[]) %}
          {% for c in car_list %}
            {% set a = 'binary_sensor.gate_' ~ c.p ~ '_away_long_enough' %}
            {% set nav = 'binary_sensor.gate_' ~ c.p ~ '_navigating_home' %}
            {% set ns.t = ns.t + [txt.car_line
                 | replace('{car}', c.name)
                 | replace('{m}', state_attr(a, 'gate_distance_m') | string)
                 | replace('{a}', '✔' if is_state(a, 'on') else '✘')
                 | replace('{away}', state_attr(a, 'away_minutes') | string)
                 | replace('{need}', state_attr(a, 'needed_minutes') | string)
                 | replace('{c}', '✔' if is_state(nav, 'on') else '✘')
                 | replace('{dest}', state_attr(nav, 'destination') | string)
                 | replace('{riders}', riders(c.p) | from_json | join(' ' ~ txt.joiner ~ ' ') or txt.unknown)] %}
          {% endfor %}
          {{ ns.t | join('; ') }}
    - alias: Logbook, which conditions were true
      action: logbook.log
      data:
        name: "{{ txt.logbook }}"
        entity_id: input_boolean.gate_auto_open_enabled
        message: >-
          {{ (txt.opens | replace('{car}', car_name) ~ (' ' ~ txt.test_mode if test else '')) if opens
             else (txt.asks if asks else txt.not_opening) }}
          {{ txt.line | replace('{source}', source) | replace('{in_zone}', in_zone | join(', ') or txt.no_car)
             | replace('{gate}', gate_state | string) | replace('{gate_ok}', '✔' if gate_ok else '✘')
             | replace('{cooldown_ok}', '✔' if cooldown_ok else '✘') | replace('{details}', details) }}
    - choose:
        - alias: The car navigates home, open (or in test mode only notify)
          conditions:
            - condition: template
              value_template: "{{ opens }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.gate_last_auto_open
              data:
                timestamp: "{{ as_timestamp(now()) }}"
            - if:
                - condition: template
                  value_template: "{{ not test }}"
              then:
                - action: script.gate_pulse
                  data:
                    reason: "{{ txt.reason | replace('{car}', car_name) }}"
            - variables:
                notification:
                  title: "{{ ('🧪 ' ~ txt.would_open) if test else txt.opened }}"
                  message: >-
                    {{ ((txt.coming_home_who | replace('{who}', riders_text)) if riders_text else txt.coming_home)
                       | replace('{the_car}', car_called) | replace('{The_car}', car_Called)
                       | replace('{car}', car_name) }}{{ (' ' ~ txt.test_no_pulse) if test else '' }}
                  data:
                    tag: gate-auto
                    group: gate
                    actions: >-
                      {{ [] if test else [{'action': 'GATE_CLOSE', 'title': txt.close_gate, 'destructive': true}] }}
            # One notify action per phone; continue_on_error so one offline phone does not block the others.
            - repeat:
                for_each: "{{ targets }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ notification.title }}"
                      message: "{{ notification.message }}"
                      data: "{{ notification.data }}"
        - alias: Do not open but ask, the car does not navigate home
          conditions:
            - condition: template
              value_template: "{{ asks }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.gate_last_auto_open
              data:
                timestamp: "{{ as_timestamp(now()) }}"
            - variables:
                notification:
                  title: "{{ txt.ask_title }}"
                  message: >-
                    {{ (txt.ask_short_trip if ask_car != away_car
                        else (txt.ask_destination | replace('{dest}', destination)) if destination else txt.ask_no_navigation)
                       | replace('{the_car}', car_called) | replace('{The_car}', car_Called)
                       | replace('{car}', car_name) }}{{ (' (' ~ riders_text ~ ')') if riders_text else '' }}
                  data:
                    tag: gate-auto
                    group: gate
                    actions:
                      - action: GATE_OPEN
                        title: "<@ t('button_open_gate') @>"
            - repeat:
                for_each: "{{ targets }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ notification.title }}"
                      message: "{{ notification.message }}"
                      data: "{{ notification.data }}"

# --- 2. Buttons in the notifications ------------------------------------------------------------------------
- id: gate_notification_action
  alias: "<@ t('notification_action_alias') @>"
  description: >-
    <@ t('notification_action_description') @>
<% if gate_sensor %>
    <@ t('notification_action_description_sensor') @>
<% else %>
    <@ t('notification_action_description_no_sensor') @>
<% endif %>
    <@ t('notification_action_description_parallel') @>
  mode: parallel
  max: 4
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: GATE_CLOSE
      id: close
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: GATE_OPEN
      id: open
  actions:
    - variables:
        txt:
          closed: "<@ t('gate_closed') @>"
          not_closed_yet: "<@ t('gate_not_closed_yet') @>"
          closed_at: "<@ t('message_closed_at') @>"
          not_closed: "<@ t('message_not_closed_after_tries') @>"
          close_gate: "<@ t('button_close_gate') @>"
          pulse_given: "<@ t('message_pulse_given_no_sensor') @>"
        # Which phone pressed: iOS sends sourceDeviceID/sourceDeviceName; matched on the person's key, name or phone
        # (device_tracker object id). Unknown: everyone with a phone.
        targets: >
          {% from 'gate.jinja' import people %}
          {% set ps = people() | from_json | selectattr('notify') | list %}
          {% set d = ((trigger.event.data.sourceDeviceID | default('')) ~ ' '
                      ~ (trigger.event.data.sourceDeviceName | default(''))) | lower %}
          {% set ns = namespace(l=[]) %}
          {% for p in ps %}
            {% set keys = [p.key | lower, p.name | lower] + ([p.phone.split('.')[-1]] if p.phone else []) %}
            {% if keys | select('in', d) | list | count > 0 %}{% set ns.l = ns.l + [p.notify] %}{% endif %}
          {% endfor %}
          {{ ns.l if ns.l else ps | map(attribute='notify') | list }}
    - choose:
        - conditions:
            - condition: trigger
              id: close
          sequence:
<% if gate_sensor %>
            - if:
                - condition: state
                  entity_id: binary_sensor.gate_open
                  state: "off"
              then:
                - repeat:
                    for_each: "{{ targets }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        continue_on_error: true
                        data:
                          title: "<@ t('title_already_closed') @>"
                          message: "<@ t('no_pulse_given') @>"
                          data:
                            tag: gate-status
                            group: gate
                - stop: Gate already closed
            # Blocking: "close until it is closed" (waits for a moving gate, at most 2 pulses). A second press while
            # it runs returns at once (mode single), so wait until the script is done before reading the state.
            - action: script.gate_close_manual
              continue_on_error: true
              data:
                reason: "<@ t('reason_close_notification') @>"
                notify: false
            - wait_template: "{{ is_state('script.gate_close_manual', 'off') }}"
              timeout:
                seconds: "{{ 4 * (states('input_number.gate_travel_time') | float(30) + 10) }}"
              continue_on_timeout: true
            - variables:
                closed: "{{ is_state('binary_sensor.gate_open', 'off') }}"
<% if camera %>
            - alias: Closed and automation.gate_closed_photo notifies everyone with a photo - no second message
              condition: template
              value_template: "{{ not closed or is_state('input_boolean.gate_closed_notify', 'off') }}"
            - action: script.gate_snapshot
              continue_on_error: true
              response_variable: photo
              data:
                kind: "{{ 'closed' if closed else 'not-closed' }}"
<% endif %>
            - variables:
                note_data: >-
                  {% set d = {'tag': 'gate-closed', 'group': 'gate', 'push': {'sound': 'default'},
                              'actions': [] if closed else [{'action': 'GATE_CLOSE', 'title': txt.close_gate}]} %}
<% if camera %>
                  {{ dict(d, image=photo.image) if photo is defined and photo.image is defined else d }}
<% else %>
                  {{ d }}
<% endif %>
            - repeat:
                for_each: "{{ targets }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ txt.closed if closed else txt.not_closed_yet }}"
                      message: >-
                        {{ txt.closed_at | replace('{time}', now().strftime('%H:%M')) if closed
                           else txt.not_closed | replace('{pulses}', '2') }}
                      data: "{{ note_data }}"
<% else %>
            - action: script.gate_close_manual
              data:
                reason: "<@ t('reason_close_notification') @>"
            - repeat:
                for_each: "{{ targets }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "<@ t('title_pulse_given') @>"
                      message: "{{ txt.pulse_given | replace('{time}', now().strftime('%H:%M')) }}"
                      data:
                        tag: gate-status
                        group: gate
<% endif %>
        - conditions:
            - condition: trigger
              id: open
          sequence:
            - action: script.gate_open_manual
<% if gate_sensor %>

# --- 3. Gate open too long ---------------------------------------------------------------------------------------
- id: gate_open_too_long
  alias: "<@ t('open_too_long_alias') @>"
  description: >-
    <@ t('open_too_long_description') @>
<% if 'parcel-service' in modules %>
    <@ t('open_too_long_description_parcel') @>
<% endif %>
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.gate_open
      to: "on"
      for:
        minutes: "{{ states('input_number.gate_open_alert_minutes') | int(10) }}"
      id: open
    - trigger: state
      entity_id: binary_sensor.gate_open
      to: "off"
      id: closed
<% if 'parcel-service' in modules %>
  conditions:
    - alias: "Parcel service: no alert while the parcel script holds the gate open (it reports a failed close itself)"
      condition: template
      value_template: "{{ trigger.id != 'open' or is_state('script.parcel_garage', 'off') }}"
<% endif %>
  actions:
    - variables:
        txt:
          title: "<@ t('title_open_minutes') @>"
          message: "<@ t('message_open_since') @>"
        targets: "{% from 'gate.jinja' import recipients %}{{ recipients() | from_json }}"
    - choose:
        - conditions:
            - condition: trigger
              id: closed
          sequence:
            - repeat:
                for_each: "{{ targets }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      message: clear_notification
                      data:
                        tag: gate-open-too-long
      default:
        - repeat:
            sequence:
<% if camera %>
              - action: script.gate_snapshot
                continue_on_error: true
                response_variable: photo
                data:
                  kind: open-too-long
<% endif %>
              - variables:
                  minutes: >
                    {{ ((now() - states.binary_sensor.gate_open.last_changed).total_seconds() / 60) | round(0) | int }}
                  notification:
                    title: "{{ txt.title | replace('{minutes}', minutes | string) }}"
                    message: >-
                      {{ txt.message | replace('{time}', as_local(states.binary_sensor.gate_open.last_changed).strftime('%H:%M')) }}
                    data:
                      tag: gate-open-too-long
                      group: gate
                      # iOS: play the sound (Android ignores it). Not critical, not time-sensitive.
                      push:
                        sound: default
                      actions:
                        - action: GATE_CLOSE
                          title: "<@ t('button_close_gate') @>"
              - repeat:
                  for_each: "{{ targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ notification.title }}"
                        message: "{{ notification.message }}"
<% if camera %>
                        # With the photo of this moment (script.gate_snapshot), when the camera gave one.
                        data: >-
                          {{ dict(notification.data, image=photo.image) if photo is defined and photo.image is defined
                             else notification.data }}
<% else %>
                        data: "{{ notification.data }}"
<% endif %>
              - wait_for_trigger:
                  - trigger: state
                    entity_id: binary_sensor.gate_open
                    to: "off"
                timeout:
                  minutes: "{{ states('input_number.gate_open_alert_minutes') | int(10) }}"
                continue_on_timeout: true
            until:
              - condition: template
                value_template: "{{ not is_state('binary_sensor.gate_open', 'on') or repeat.index >= 6 }}"

<% if camera %>
# --- 3b. Gate closed: notification with a photo of that moment ----------------------------------------------------
# On EVERY closing, whatever closed it (a button or card in HA, closing after leaving, the remote, Google Home, the
# wall button). The one place that says "Gate is closed": the HA flows send no closed message of their own while
# input_boolean.gate_closed_notify is on. Fixed tag gate-closed: it replaces the previous closed message and a
# "not closed yet" of a HA flow (same tag). Camera: <@ check_camera @> (gate.check_camera, else the garage camera).
<% if dark %>
# Garage dark at the closing (<@ dark @> on): wait max 5 s for light, else no photo (a black photo proves nothing).
<% endif %>
- id: gate_closed_photo
  alias: "<@ t('closed_photo_alias') @>"
  description: >-
    <@ t('closed_photo_description', camera=check_camera) @>
<% if dark %>
    <@ t('closed_photo_description_dark', dark=dark) @>
<% endif %>
<% if 'parcel-service' in modules %>
    <@ t('closed_photo_description_parcel') @>
<% endif %>
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.gate_open
      from: "on"
      to: "off"
  conditions:
    - condition: state
      entity_id: input_boolean.gate_closed_notify
      state: "on"
<% if 'parcel-service' in modules %>
    - alias: "Parcel service: its own proof photo goes to whoever subscribed, no second message"
      condition: state
      entity_id: script.parcel_garage
      state: "off"
<% endif %>
  actions:
    - variables:
        txt:
          title: "<@ t('gate_closed') @>"
          message: "<@ t('message_closed_at') @>"
          open_gate: "<@ t('button_open_gate') @>"
<% if dark %>
          no_photo_dark: "<@ t('message_no_photo_dark') @>"
<% endif %>
        targets: "{% from 'gate.jinja' import recipients %}{{ recipients() | from_json }}"
        closed_at: "{{ now().strftime('%H:%M') }}"
<% if dark %>
        # Set inside the if below (a variables step updates the outer variable, HA 2025.4 and newer).
        photo: {}
    - alias: Garage dark - wait max 5 s for light (light on motion)
      wait_template: "{{ not is_state('<@ dark @>', 'on') }}"
      timeout:
        seconds: 5
      continue_on_timeout: true
    - variables:
        dark_now: "{{ is_state('<@ dark @>', 'on') }}"
    # Still dark: no photo (a black photo proves nothing).
    - if:
        - condition: template
          value_template: "{{ not dark_now }}"
      then:
        - action: script.gate_snapshot
          continue_on_error: true
          response_variable: shot
          data:
            kind: closed
            camera: <@ check_camera @>
        - variables:
            photo: "{{ shot if shot is defined and shot.image is defined else {} }}"
<% else %>
    - action: script.gate_snapshot
      continue_on_error: true
      response_variable: photo
      data:
        kind: closed
        camera: <@ check_camera @>
<% endif %>
    - variables:
        note_data: >-
          {% set d = {'tag': 'gate-closed', 'group': 'gate', 'push': {'sound': 'default'},
                      'actions': [{'action': 'GATE_OPEN', 'title': txt.open_gate}]} %}
          {{ dict(d, image=photo.image) if photo is defined and photo.image is defined else d }}
    - repeat:
        for_each: "{{ targets }}"
        sequence:
          - action: "{{ repeat.item }}"
            continue_on_error: true
            data:
              title: "{{ txt.title }}"
<% if dark %>
              message: >-
                {{ txt.message | replace('{time}', closed_at) }}{{ (' ' ~ txt.no_photo_dark) if dark_now else '' }}
<% else %>
              message: "{{ txt.message | replace('{time}', closed_at) }}"
<% endif %>
              data: "{{ note_data }}"

<% endif %>
# --- 4. Close the gate behind a departing car -------------------------------------------------------------------
- id: gate_close_after_departure
  alias: "<@ t('close_after_departure_alias') @>"
  description: >-
    <@ t('close_after_departure_description') @>
  mode: parallel
  max: 4
  triggers:
    # Fires only when the car crosses the distance outward (false -> true), not while it is parked near the house.
<% for a in cars %>
    - trigger: template
      value_template: >
        {{ has_value('<@ car_entity(a, 'location') @>') and
           distance('<@ car_entity(a, 'location') @>', 'zone.home') * 1000 > states('input_number.gate_close_distance') | float(50) }}
      id: <@ a.prefix @>
<% endfor %>
  conditions:
    - condition: state
      entity_id: input_boolean.gate_auto_close_enabled
      state: "on"
    - condition: state
      entity_id: binary_sensor.gate_open
      state: "on"
  actions:
    - variables:
        txt:
          logbook: "<@ t('close_after_departure_alias') @>"
          would_close_log: "<@ t('log_would_close') @>"
          reason: "<@ t('reason_after_departure') @>"
          would_close: "<@ t('title_would_close') @>"
          closed: "<@ t('gate_closed') @>"
          not_closed_yet: "<@ t('gate_not_closed_yet') @>"
          left_test: "<@ t('message_left_test') @>"
          left_closed: "<@ t('message_left_closed') @>"
          left_closed_itself: "<@ t('message_left_closed_itself') @>"
          left_not_closed: "<@ t('message_left_not_closed') @>"
          # No pulse given, per verdict; {why} = what the AI saw.
          left_no_pulse:
            moving: "<@ t('message_left_moving_not_closed') @>"
            closing: "<@ t('message_left_moving_not_closed') @>"
            opening: "<@ t('message_left_opening') @>"
            closed: "<@ t('message_left_photo_closed') @>"
            unsure: "<@ t('message_left_unsure') @>"
          decision: "<@ t('log_departure_decision') @>"
          moving_why:
            pulse: "<@ t('moving_why_pulse') @>"
            opened: "<@ t('moving_why_opened') @>"
            cover: "<@ t('moving_why_cover') @>"
          action_pulse: "<@ t('log_action_close') @>"
          action_test: "<@ t('log_action_test') @>"
          action_none: "<@ t('log_action_none') @>"
          verdict:
            moving: "<@ t('verdict_moving') @>"
            closing: "<@ t('verdict_closing') @>"
            opening: "<@ t('verdict_opening') @>"
            open: "<@ t('verdict_open') @>"
            half_open: "<@ t('verdict_half_open') @>"
            closed: "<@ t('verdict_closed') @>"
            unsure: "<@ t('verdict_unsure') @>"
            none: "<@ t('verdict_none') @>"
          open_gate: "<@ t('button_open_gate') @>"
          close_gate: "<@ t('button_close_gate') @>"
        car_list: "{% from 'gate.jinja' import cars %}{{ cars() | from_json }}"
        people_list: "{% from 'gate.jinja' import people %}{{ people() | from_json }}"
        car: "{{ trigger.id }}"
        car_name: "{{ car_list | selectattr('p', 'eq', car) | map(attribute='name') | first | default('Tesla') }}"
        car_called: "{{ car_list | selectattr('p', 'eq', car) | map(attribute='called') | first | default(car_name) }}"
        usual_driver: "{{ car_list | selectattr('p', 'eq', car) | map(attribute='driver') | first | default('') }}"
        distance_m: "{{ states('input_number.gate_close_distance') | float(50) }}"
        test: "{{ is_state('input_boolean.gate_auto_open_dry_run', 'on') }}"
    - alias: Is another car leaving too? Then wait until that one is out as well (or parked)
      wait_template: >
        {% set ns = namespace(n=0) %}
        {% for c in car_list if c.p != car %}
          {% set near = has_value(c.loc) and distance(c.loc, 'zone.home') * 1000 <= distance_m %}
          {# The last speed sticks after parking (e.g. 0.999 km/h in P), so speed only counts outside P and while awake. #}
          {% set shift = states(c.shift) | lower %}
          {% set driving = not is_state(c.status, 'off')
                           and (shift in ['d', 'r'] or (shift != 'p' and states(c.speed) | float(0) > 2)) %}
          {% if near and driving %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% endfor %}
        {{ ns.n == 0 }}
      timeout: "00:03:00"
      continue_on_timeout: false
    - condition: state
      entity_id: binary_sensor.gate_open
      state: "on"
    # What does the gate do right now? The remote of whoever drives off, Google Home or the relay's app may have
    # started it already, and a pulse on a moving gate stops or reverses it.
    #   moving  = binary_sensor.gate_moving (a pulse or an opening less than the travel time ago): no pulse
<% if ai_check %>
    #   else two photos <@ camera @>, judged by script.gate_photo_check (AI): closing = no pulse; open / half_open =
    #   close (gate_close_manual); opening, closed (while the sensor says open), unsure = no pulse, notification
    #   with photo; none = no AI service at this moment: close as without a camera
<% else %>
    #   else close (gate_close_manual: close until it is closed)<@ '' if camera else '; no garage camera, so no photo check' @>
<% endif %>
    - variables:
        travel: "{{ states('input_number.gate_travel_time') | float(30) }}"
        moving: "{{ is_state('binary_sensor.gate_moving', 'on') }}"
        moving_reason: >-
          {{ txt.moving_why.get(state_attr('binary_sensor.gate_moving', 'reason') | string,
                                state_attr('binary_sensor.gate_moving', 'reason') | string) }}
<% if ai_check %>
    # At the top level (not inside an if) so `check` is visible below; skip: the gate is moving, no photos needed.
    - action: script.gate_photo_check
      continue_on_error: true
      response_variable: check
      data:
        skip: "{{ moving }}"
<% endif %>
    - variables:
        verdict: >-
<% if ai_check %>
          {{ 'moving' if moving else (check.state if check is defined and check.state is defined else 'unsure') }}
<% else %>
          {{ 'moving' if moving else 'none' }}
<% endif %>
        check_text: >-
<% if ai_check %>
          {{ check.description | default('') if check is defined else '' }}
<% else %>
          {{ '' }}
<% endif %>
        # Pulse (through gate_close_manual) only when the gate stands still: open, half open, or no photo check.
        pulse: "{{ verdict in ['open', 'half_open', 'none'] }}"
    - action: logbook.log
      data:
        name: "{{ txt.logbook }}"
        entity_id: input_boolean.gate_auto_close_enabled
        message: >-
          {{ txt.decision | replace('{the_car}', car_called) | replace('{car}', car_name)
             | replace('{verdict}', txt.verdict.get(verdict, verdict)) | replace('{why}', moving_reason if moving else check_text)
             | replace('{action}', (txt.action_test if test else txt.action_pulse) if pulse else txt.action_none) }}
    - choose:
        - alias: Test mode and it would pulse
          conditions:
            - condition: template
              value_template: "{{ test and pulse }}"
          sequence:
            - action: logbook.log
              data:
                name: "{{ txt.logbook }}"
                entity_id: input_boolean.gate_auto_close_enabled
                message: >-
                  {{ txt.would_close_log | replace('{the_car}', car_called) | replace('{car}', car_name)
                     | replace('{m}', distance_m | int | string) }}
        - alias: Close until it is closed (blocking; then the state is read below)
          conditions:
            - condition: template
              value_template: "{{ pulse }}"
          sequence:
            - action: script.gate_close_manual
              continue_on_error: true
              data:
                reason: "{{ txt.reason | replace('{car}', car_name) }}"
                notify: false
            - wait_template: "{{ is_state('script.gate_close_manual', 'off') }}"
              timeout:
                seconds: "{{ 4 * (travel + 10) }}"
              continue_on_timeout: true
        - alias: Moving or closing by itself - no pulse, wait for the end position closed
          conditions:
            - condition: template
              value_template: "{{ verdict in ['moving', 'closing'] }}"
          sequence:
            - wait_template: "{{ not is_state('binary_sensor.gate_open', 'on') }}"
              timeout:
                seconds: "{{ travel + 10 }}"
              continue_on_timeout: true
    - variables:
        closed: "{{ is_state('binary_sensor.gate_open', 'off') }}"
        would_close: "{{ test and pulse }}"
<% if camera %>
    - alias: Closed and automation.gate_closed_photo notifies everyone with a photo - no second message
      condition: template
      value_template: "{{ would_close or not closed or is_state('input_boolean.gate_closed_notify', 'off') }}"
    # Photo of this moment, before waiting for the phones: proof that it closed, or what it looks like now.
    - action: script.gate_snapshot
      continue_on_error: true
      response_variable: photo
      data:
        kind: "{{ 'closed' if closed else 'not-closed' }}"
<% endif %>
    - alias: Phones report leaving with some delay, wait at most 3 min
      wait_template: >
        {% set ns = namespace(n=0) %}
        {% for p in people_list %}
          {% set s = states[p.person] %}
          {% if s is not none and s.state != 'home' and (now() - s.last_changed).total_seconds() < 600 %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n > 0 }}
      timeout: "00:03:00"
      continue_on_timeout: true
    - variables:
        # People whose person left home in the last 10 min, else the usual driver of the car.
        targets: >
          {% set ns = namespace(l=[]) %}
          {% for p in people_list if p.notify %}
            {% set s = states[p.person] %}
            {% if s is not none and s.state != 'home' and (now() - s.last_changed).total_seconds() < 600 %}
              {% set ns.l = ns.l + [p.notify] %}
            {% endif %}
          {% endfor %}
          {% set usual = people_list | selectattr('key', 'eq', usual_driver) | selectattr('notify') | map(attribute='notify') | list %}
          {{ ns.l or usual or (people_list | selectattr('notify') | map(attribute='notify') | list) }}
        message: >-
          {%- if would_close %}{% set m = txt.left_test %}
          {%- elif closed %}{% set m = txt.left_closed if pulse else txt.left_closed_itself %}
          {%- elif verdict in ['open', 'half_open', 'none'] %}{% set m = txt.left_not_closed %}
          {%- else %}{% set m = txt.left_no_pulse.get(verdict, txt.left_no_pulse.unsure) %}
          {%- endif %}
          {{- m | replace('{the_car}', car_called) | replace('{car}', car_name) | replace('{why}', check_text) }}
        note_data: >-
          {% set d = {'tag': 'gate-closed', 'group': 'gate', 'push': {'sound': 'default'},
                      'actions': [] if would_close
                                 else ([{'action': 'GATE_OPEN', 'title': txt.open_gate}] if closed
                                       else [{'action': 'GATE_CLOSE', 'title': txt.close_gate}])} %}
<% if camera %>
          {{ dict(d, image=photo.image) if photo is defined and photo.image is defined else d }}
<% else %>
          {{ d }}
<% endif %>
    - repeat:
        for_each: "{{ targets }}"
        sequence:
          - action: "{{ repeat.item }}"
            continue_on_error: true
            data:
              title: >-
                {{ ('🧪 ' ~ txt.would_close) if would_close else (txt.closed if closed else txt.not_closed_yet) }}
              message: "{{ message }}"
              data: "{{ note_data }}"
<% endif %>
<% if phones %>

# --- 5. Watch the phones' location permission ----------------------------------------------------------------
# iOS asks now and then whether to keep "Always"; with "While using" the phone sends no positions on the road, so
# the zone trigger, the arrival card and "who is in the car" go blind without any error.
- id: phone_location_permission_watch
  alias: "<@ t('location_watch_alias') @>"
  description: >-
    <@ t('location_watch_description') @>
  mode: queued
  triggers:
    - trigger: state
      entity_id:
<% for x in phones %>
        - <@ x.get('location_permission') or 'sensor.' ~ x.phone ~ '_location_permission' @>
<% endfor %>
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
  conditions:
    - alias: Only when 'Always' is lost or restored
      condition: template
      value_template: >
        {{ (trigger.from_state.state == 'Authorized Always') != (trigger.to_state.state == 'Authorized Always') }}
  actions:
    - variables:
        txt:
          a_phone: "<@ t('a_phone') @>"
          title_ok: "<@ t('title_location_ok') @>"
          title_lost: "<@ t('title_location_lost') @>"
          message_ok: "<@ t('message_location_ok') @>"
          message_lost: "<@ t('message_location_lost') @>"
        people_list: "{% from 'gate.jinja' import people %}{{ people() | from_json }}"
        owner: "{{ people_list | selectattr('location_permission', 'eq', trigger.entity_id) | first | default({}) }}"
        name: "{{ owner.name | default(txt.a_phone) }}"
        ok: "{{ trigger.to_state.state == 'Authorized Always' }}"
        targets: >
          {% set b = people_list | selectattr('admin') | selectattr('notify') | map(attribute='notify') | list %}
          {{ (b if ok or not owner.notify | default(none) else b + [owner.notify]) | unique | list }}
    - repeat:
        for_each: "{{ targets }}"
        sequence:
          - action: "{{ repeat.item }}"
            continue_on_error: true
            data:
              title: >-
                {{ (txt.title_ok if ok else txt.title_lost) | replace('{name}', name) }}
              message: >-
                {{ (txt.message_ok if ok else txt.message_lost | replace('{state}', trigger.to_state.state))
                   | replace('{name}', name) }}
              data:
                tag: location-{{ owner.key | default('phone') }}
                group: gate
<% endif %>
<% if relay_domain in ['switch', 'button'] %>

# --- 5b. Every relay click counts as a pulse ---------------------------------------------------------------------
# A click that does not come from script.gate_pulse (the HA UI, the relay's own app, Google Home, a cloud service)
# moves the gate just as well. This sets input_datetime.gate_last_pulse for it, so the pulse block and
# binary_sensor.gate_moving see it too, and writes it in the logbook.
<% if relay_domain == 'button' %>
# Button: only a press through Home Assistant changes its state; a press in the device's own app stays invisible.
<% endif %>
# A cover is not handled here: it reports opening/closing itself, whoever started it (binary_sensor.gate_moving).
- id: gate_relay_seen
  alias: "<@ t('relay_seen_alias') @>"
  description: >-
    <@ t('relay_seen_description', relay=relay) @>
  mode: single
  max_exceeded: silent
  triggers:
<% if relay_domain == 'switch' %>
    - trigger: state
      entity_id: <@ relay @>
      from: "off"
      to: "on"
<% else %>
    - trigger: state
      entity_id: <@ relay @>
      not_from: unavailable
      not_to:
        - unavailable
        - unknown
<% endif %>
<% if relay_domain == 'button' %>
  conditions:
    - alias: A real press now (not a restored state after a restart)
      condition: template
      value_template: >-
        {{ trigger.from_state is not none and
           (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 10 }}
<% endif %>
  actions:
    - variables:
        txt:
          logbook: "<@ t('logbook_gate') @>"
          outside: "<@ t('log_pulse_outside') @>"
          by_user: "<@ t('source_ha_user') @>"
          by_automation: "<@ t('source_automation') @>"
          by_device: "<@ t('source_outside') @>"
        clicked: "{{ as_timestamp(trigger.to_state.last_changed) }}"
        user: >-
          {{ states.person | selectattr('attributes.user_id', 'eq', trigger.to_state.context.user_id)
             | map(attribute='name') | first | default('') if trigger.to_state.context.user_id else '' }}
    # script.gate_pulse sets gate_last_pulse right after its own click: give it a moment.
    - delay:
        seconds: 2
    - alias: Not from script.gate_pulse (its last pulse is more than 3 s older than this click)
      condition: template
      value_template: >-
        {{ (state_attr('input_datetime.gate_last_pulse', 'timestamp') | float(0)) < clicked - 3 }}
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_last_pulse
      data:
        timestamp: "{{ clicked }}"
    - action: logbook.log
      data:
        name: "{{ txt.logbook }}"
        entity_id: <@ relay @>
        message: >-
          {% set c = trigger.to_state.context %}
          {{ txt.outside | replace('{source}',
               (txt.by_user | replace('{name}', user or '?')) if c.user_id
               else txt.by_automation if c.parent_id else txt.by_device) }}
<% endif %>

# --- 6. Reset the Tesla command counter at midnight -------------------------------------------------------------
- id: tesla_commands_counter_reset
  alias: "<@ t('counter_reset_alias') @>"
  description: >-
    <@ t('counter_reset_description') @>
  mode: single
  triggers:
    - trigger: time
      at: "00:00:00"
  actions:
    - action: counter.reset
      target:
        entity_id: counter.tesla_commands_today
