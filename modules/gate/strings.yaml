# User-facing texts of the module gate, one key per text: {en: ..., nl: ...}. Used in the module's files as
# <@ t('key') @> (tools/fill.py picks house.language, default en; a missing language falls back to en with a warning).
# Rules for these texts:
# - no double quotes or backslashes: they are inserted between double quotes in YAML;
# - {car}, {who}, {name}, ... without a value at fill time stay in the text and are filled in by Home Assistant at
#   run time (replace('{car}', ...) in the automations and scripts); keep them when you translate;
# - no emoji: the templates add them (a JSON escape of an emoji breaks in YAML).

