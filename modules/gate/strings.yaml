helper_dry_run: { en: "Gate test mode", nl: "Poort testmodus" }
helper_auto_close_enabled: { en: "Gate: close automatically after leaving", nl: "Poort automatisch sluiten bij vertrek" }
helper_away_minutes: { en: "Gate minimum time away", nl: "Poort minimaal weg" }
helper_far_distance: { en: "Gate far-enough distance", nl: "Poort ver genoeg afstand" }
helper_nav_home_tolerance: { en: "Gate home destination tolerance", nl: "Poort tolerantie bestemming thuis" }
helper_open_alert_minutes: { en: "Gate open alert after", nl: "Poort open-melding na" }
helper_close_distance: { en: "Gate close after leaving at", nl: "Poort sluiten na vertrek op" }
helper_last_pulse: { en: "Gate last pulse", nl: "Poort laatste puls" }
helper_last_auto_open: { en: "Gate last automatic opening", nl: "Poort laatst automatisch geopend" }
helper_tesla_commands_today: { en: "Tesla commands today", nl: "Tesla-commando's vandaag" }

