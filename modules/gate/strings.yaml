# --- automation gate_auto_open ---
auto_open_alias: { en: "Gate: open automatically", nl: "Poort automatisch openen" }
auto_open_description:
  en: >-
    Opens the gate when a Tesla comes home while navigating home, whoever is in it.
    Trigger: a Tesla (or a phone) enters zone.gate_approach.
    Per car: A = binary_sensor.gate_<car>_away_long_enough (was far away long enough),
    C = binary_sensor.gate_<car>_navigating_home (destination home).
    When the car does not navigate home, or navigates home after a short trip (C without A), the gate does not
    open but a notification asks.
    Guards: the car is in the approach zone, the gate is not open, at most once per 5 min
    (input_datetime.gate_last_auto_open), master switch input_boolean.gate_auto_open_enabled,
    test mode input_boolean.gate_auto_open_dry_run. Every evaluation goes into the logbook.
  nl: >-
    Opent de poort als een Tesla thuiskomt die naar huis navigeert, wie er ook in zit.
    Trigger: een Tesla (of een gsm) komt zone.gate_approach binnen.
    Per auto: A = binary_sensor.gate_<auto>_away_long_enough (lang genoeg ver weg geweest),
    C = binary_sensor.gate_<auto>_navigating_home (bestemming thuis).
    Navigeert de auto niet naar huis, of navigeert ze naar huis na een korte rit (C zonder A), dan opent de poort
    niet maar vraagt een melding het.
    Bewakingen: de auto staat in de naderingszone, de poort staat niet open, max 1x per 5 min
    (input_datetime.gate_last_auto_open), hoofdschakelaar input_boolean.gate_auto_open_enabled,
    testmodus input_boolean.gate_auto_open_dry_run. Elke evaluatie komt in het logboek.
log_opens: { en: "OPENS {car}", nl: "OPENT {car}" }
log_test_mode: { en: "(test mode)", nl: "(testmodus)" }
log_asks: { en: "ASKS via notification", nl: "VRAAGT via melding" }
log_not_opening: { en: "does not open", nl: "opent niet" }
log_line:
  en: "| trigger {source} | in the zone: {in_zone} | gate {gate} {gate_ok} | cooldown {cooldown_ok} | {details}"
  nl: "| trigger {source} | in de zone: {in_zone} | poort {gate} {gate_ok} | cooldown {cooldown_ok} | {details}"
log_no_car: { en: "no car", nl: "geen auto" }
log_no_sensor: { en: "no sensor", nl: "geen sensor" }
log_car:
  en: "{car}: {m} m from the gate, A {a} ({away}/{need} min far away), C {c} (destination '{dest}'), in it: {riders}"
  nl: "{car}: {m} m van de poort, A {a} ({away}/{need} min ver weg), C {c} (bestemming '{dest}'), erin: {riders}"
reason_auto_open: { en: "automatic ({car})", nl: "automatisch ({car})" }
title_would_open: { en: "Gate would open", nl: "Poort zou openen" }
title_opened: { en: "Gate opened", nl: "Poort geopend" }
