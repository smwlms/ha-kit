# --- automation gate_relay_seen ---
relay_seen_alias: { en: "Gate: relay click seen", nl: "Poort: relaisklik gezien" }
relay_seen_description:
  en: >-
    Every click of {relay} that does not come from script.gate_pulse (the Home Assistant interface, the relay's own
    app, Google Home, a cloud service) moves the gate too. Sets input_datetime.gate_last_pulse for it, so the pulse
    block and binary_sensor.gate_moving count it, and writes it in the logbook.
  nl: >-
    Elke klik van {relay} die niet van script.gate_pulse komt (de Home Assistant-interface, de app van het relais,
    Google Home, een clouddienst) beweegt de poort ook. Zet input_datetime.gate_last_pulse ervoor, zodat de
    pulsblokkade en binary_sensor.gate_moving ze meetellen, en schrijft ze in het logboek.
log_pulse_outside:
  en: "pulse outside Home Assistant's gate scripts ({source}); counts as last pulse"
  nl: "puls buiten de poortscripts van Home Assistant om ({source}); telt als laatste puls"
source_ha_user: { en: "Home Assistant interface, {name}", nl: "Home Assistant-interface, {name}" }
source_automation: { en: "another automation or script", nl: "een andere automatisering of script" }
source_outside: { en: "relay app, Google Home, cloud or the device itself", nl: "app van het relais, Google Home, cloud of het toestel zelf" }

# --- automation tesla_commands_counter_reset ---
counter_reset_alias: { en: "Reset Tesla command counter", nl: "Tesla-commandoteller op nul" }
counter_reset_description:
  en: Sets counter.tesla_commands_today to zero at midnight (counts the commands of the charge cable button).
  nl: Zet counter.tesla_commands_today om middernacht op nul (telt de commando's van de laadkabel-knop).

# --- script gate_pulse ---
pulse_alias: { en: "Gate pulse (internal)", nl: "Poort puls (intern)" }
pulse_description_switch:
  en: >-
    One pulse on {relay} (impulse relay with auto-off). Waits up to 45 s when the relay is offline: wifi relays
    sometimes drop out briefly. A second call during a running pulse (relay 'on') is ignored.
  nl: >-
    Eén puls op {relay} (impulsrelais met auto-off). Wacht tot 45 s als het relais offline is: wifi-relais vallen
    soms even weg. Een tweede oproep tijdens een lopende puls (relais 'on') wordt genegeerd.
pulse_description_button:
  en: One press on {relay} (gate module with a button).
  nl: Eén druk op {relay} (poortmodule met een knop).
pulse_description_cover:
  en: "One operation of {relay} (cover): open when it is closed, otherwise close."
  nl: "Eén bediening van {relay} (cover): openen als ze dicht is, anders sluiten."
pulse_description_common:
  en: >-
    A new pulse within the travel time (input_number.gate_travel_time) of the previous one is ignored
    (input_datetime.gate_last_pulse, also set by automation.gate_relay_seen for a click from elsewhere), unless
    force: true: two pulses shortly after each other make the gate stop or reverse.
  nl: >-
    Een nieuwe puls binnen de looptijd (input_number.gate_travel_time) na de vorige wordt genegeerd
    (input_datetime.gate_last_pulse, ook gezet door automation.gate_relay_seen bij een klik van elders), tenzij
    force: true: twee pulsen kort na elkaar laten de poort stoppen of keren.
field_reason_name: { en: "Reason", nl: "Reden" }
field_reason_description: { en: "Goes into the logbook.", nl: "Komt in het logboek." }
field_reason_example: { en: "manual", nl: "handmatig" }
field_force_name: { en: "Force", nl: "Forceren" }
field_force_description:
  en: Pulse even when the previous pulse was less than the travel time ago.
  nl: Ook een puls geven als de vorige minder dan de looptijd geleden was.
log_unreachable: { en: "no pulse: gate control unreachable ({reason})", nl: "geen puls: poortbediening onbereikbaar ({reason})" }
title_not_operated: { en: "Gate not operated", nl: "Poort niet bediend" }
message_unreachable: { en: "The gate control is unreachable.", nl: "De poortbediening is onbereikbaar." }
log_pulse_ignored:
  en: "pulse ignored: previous pulse {seconds} s ago ({reason})"
  nl: "puls genegeerd: vorige puls {seconds} s geleden ({reason})"
log_pulse_given: { en: "pulse given ({reason})", nl: "puls gegeven ({reason})" }

# --- script gate_open_manual ---
open_manual_alias: { en: "Open gate", nl: "Poort openen" }
open_manual_description:
  en: Opens the gate, independent of the automatic logic and of the master switch.
  nl: Opent de poort, los van de automatische logica en van de hoofdschakelaar.
open_manual_description_sensor:
  en: >-
    When binary_sensor.gate_open reports open (or the gate is moving), no pulse: a pulse on an open gate closes it.
    When the gate state is unreachable, it does pulse.
  nl: >-
    Meldt binary_sensor.gate_open 'open' (of beweegt de poort), dan geen puls: een puls op een open poort sluit ze.
    Is de poortstand onbereikbaar, dan wel een puls.
open_manual_description_no_sensor:
  en: "Without a gate sensor it always pulses: when the gate is already open, it closes."
  nl: "Zonder poortsensor geeft het altijd een puls: staat de poort al open, dan sluit ze."
title_not_closed: { en: "Gate is not closed", nl: "Poort staat niet dicht" }
message_open_or_moving: { en: "The gate is open or moving. No pulse given.", nl: "De poort is open of beweegt. Geen puls gegeven." }
reason_manual_open: { en: "manual open", nl: "handmatig openen" }

# --- script gate_close_manual ---
close_manual_alias: { en: "Close gate", nl: "Poort sluiten" }
close_manual_description_sensor:
  en: >-
    Closes the gate until it reports closed, only when binary_sensor.gate_open reports open (closed or unreachable:
    no pulse, a pulse on a closed gate opens it). While the gate moves (binary_sensor.gate_moving) no pulse: it waits
    for closed. Standing still: a pulse, then up to travel time + 10 s for closed. Still open: the gate stood
    halfway and reversed, so one more pulse. At most max_pulses (default 2). With notify a notification
    'Gate is closed' or 'not closed yet' to whoever started it, with a photo when there is a garage camera.
  nl: >-
    Sluit de poort tot ze dicht meldt, enkel als binary_sensor.gate_open 'open' meldt (dicht of onbereikbaar: geen
    puls, een puls op een dichte poort opent ze). Zolang de poort beweegt (binary_sensor.gate_moving) geen puls:
    wachten op dicht. Staat ze stil: een puls, dan tot looptijd + 10 s wachten op dicht. Nog open: de poort stond
    halverwege en keerde om, dus nog één puls. Max. max_pulses (standaard 2). Met notify een melding 'Poort is
    dicht' of 'nog niet dicht' aan wie het startte, met een foto als er een garagecamera is.
close_manual_description_no_sensor:
  en: >-
    Gives a pulse. Without a gate sensor Home Assistant does not know whether the gate is open: only press when you
    see that it is open.
  nl: >-
    Geeft een puls. Zonder poortsensor weet Home Assistant niet of de poort open staat: druk enkel als je ziet dat
    ze open is.
field_reason_example_close: { en: "close from card", nl: "sluiten via kaart" }
log_close_no_pulse:
  en: "no pulse on close: gate reports {state} ({reason})"
  nl: "geen puls bij sluiten: poort meldt {state} ({reason})"
reason_close: { en: "close", nl: "sluiten" }
reason_close_pulse_of: { en: "pulse {n} of {max}", nl: "puls {n} van {max}" }
field_max_pulses_name: { en: "Maximum pulses", nl: "Maximaal aantal pulsen" }
field_max_pulses_description:
  en: How many pulses at most when the gate does not close (it may have stood halfway and reversed).
  nl: Hoeveel pulsen maximaal als de poort niet dichtgaat (ze kan halverwege gestaan hebben en omgekeerd zijn).
field_notify_name: { en: "Notify", nl: "Melden" }
field_notify_description:
  en: Afterwards a notification 'closed' or 'not closed yet' to whoever started it. Off when the caller reports itself.
  nl: Daarna een melding 'dicht' of 'nog niet dicht' aan wie het startte. Uit als de aanroeper zelf meldt.
moving_why_pulse: { en: "pulse less than the travel time ago", nl: "puls minder dan de looptijd geleden" }
moving_why_opened: { en: "opening seen less than the travel time ago", nl: "opening gezien minder dan de looptijd geleden" }
moving_why_cover: { en: "the cover reports opening or closing", nl: "de cover meldt openen of sluiten" }
log_close_waiting_moving:
  en: "no pulse: the gate is moving ({why}), waiting for closed ({reason})"
  nl: "geen puls: de poort beweegt ({why}), wachten op dicht ({reason})"
log_close_retry:
  en: "not closed {seconds} s after pulse {n}: the gate stood halfway and reversed, one more pulse ({reason})"
  nl: "niet dicht {seconds} s na puls {n}: de poort stond halverwege en keerde om, nog één puls ({reason})"
log_close_closed: { en: "gate reports closed ({reason})", nl: "poort meldt dicht ({reason})" }
log_close_gave_up:
  en: "still not closed after at most {pulses} pulses: stopped trying ({reason})"
  nl: "nog altijd niet dicht na max. {pulses} pulsen: gestopt met proberen ({reason})"

# --- script gate_snapshot (only with entities.garage_camera); {camera} is filled in at fill time ---
snapshot_alias: { en: "Gate photo (internal)", nl: "Poort foto (intern)" }
snapshot_description:
  en: >-
    Photo of this moment from {camera} to /media/gate/<kind>-<minute>.jpg (at most 60 files per kind). Answers
    with image (for a notification) and media (for an AI service). A file, so the notification shows that moment.
  nl: >-
    Foto van dit moment van {camera} naar /media/gate/<soort>-<minuut>.jpg (max. 60 bestanden per soort). Antwoordt
    met image (voor een melding) en media (voor een AI-dienst). Een bestand, zodat de melding dat moment toont.
field_kind_name: { en: "Kind", nl: "Soort" }
field_kind_description: { en: "Part of the file name, e.g. closed.", nl: "Deel van de bestandsnaam, bv. closed." }

# --- script gate_photo_check (garage camera and an AI service) ---
photo_check_alias: { en: "Gate photo check (internal)", nl: "Poort fotocheck (intern)" }
photo_check_description:
  en: >-
    Two photos of {camera}, 2 s apart, judged by an AI service (ai_task): is the gate closing, opening, open, half
    open, closed, or unsure? Used by closing after leaving before it pulses. Without an AI service it answers none.
  nl: >-
    Twee foto's van {camera}, 2 s na elkaar, beoordeeld door een AI-dienst (ai_task): sluit de poort, opent ze,
    staat ze open, half open, dicht, of onzeker? Gebruikt door sluiten na vertrek vóór het een puls geeft. Zonder
    AI-dienst antwoordt het none.
field_skip_name: { en: "Skip", nl: "Overslaan" }
field_skip_description: { en: "No photos, answer skipped.", nl: "Geen foto's, antwoord skipped." }
photo_check_dark: { en: "garage too dark", nl: "garage te donker" }
photo_check_no_ai: { en: "no AI service", nl: "geen AI-dienst" }
photo_check_no_photo: { en: "no photo from the camera", nl: "geen foto van de camera" }
photo_check_no_answer: { en: "no answer from the AI service", nl: "geen antwoord van de AI-dienst" }
photo_check_task_name: { en: "Gate closing?", nl: "Poort aan het sluiten?" }
photo_check_instructions:
  en: >-
    You get two photos from a camera in a garage, taken 2 seconds apart: first the first photo, then the second.
    Look only at the gate or garage door. Compare its position in both photos. closing = it moves towards closed
    between the first and the second photo. opening = it moves towards open. open = fully open and in the same
    place in both photos. half_open = partly open and in the same place in both photos. closed = fully closed.
    unsure = too dark, the gate is not visible, or you cannot tell. When in doubt: unsure.
  nl: >-
    Je krijgt twee foto's van een camera in een garage, 2 seconden na elkaar genomen: eerst de eerste foto, dan de
    tweede. Kijk enkel naar de poort of garagepoort. Vergelijk haar stand op beide foto's. closing = ze beweegt
    richting dicht tussen de eerste en de tweede foto. opening = ze beweegt richting open. open = volledig open en
    op beide foto's op dezelfde plaats. half_open = gedeeltelijk open en op beide foto's op dezelfde plaats.
    closed = volledig dicht. unsure = te donker, de poort is niet zichtbaar, of je kan het niet zeggen. Bij twijfel:
    unsure.
photo_check_state_question:
  en: "What the gate does: closing, opening, open, half_open, closed or unsure."
  nl: "Wat de poort doet: closing, opening, open, half_open, closed of unsure."
photo_check_description_question:
  en: "One short sentence: what you see of the gate on both photos."
  nl: "Eén korte zin: wat je van de poort ziet op beide foto's."

# --- script tesla_unlock_charge_cable ---
unlock_alias: { en: "Unlock Tesla charge cable", nl: "Laadkabel Tesla ontgrendelen" }
unlock_description:
  en: >-
    Unlocks the charge cable of the Tesla that is plugged in at home (charge cable on and 'located at home' on).
    When that car is still charging, charging stops first. When several cars are plugged in, a notification asks
    which one (one button per car and 'All', valid for 2 min). With the field car only that car, and only when a
    cable is plugged in (without a cable the car would open the charge port). Every command counts in
    counter.tesla_commands_today.
  nl: >-
    Ontgrendelt de laadkabel van de Tesla die thuis aan de kabel hangt (laadkabel aan en 'thuis gelegen' aan).
    Laadt die auto nog, dan eerst laden stoppen. Hangen meerdere auto's aan een kabel, dan vraagt een melding welke
    (een knop per auto en 'Alle', 2 min geldig). Met het veld car enkel die auto, en alleen als er een kabel in zit
    (zonder kabel zou de auto de laadklep openen). Elk commando telt in counter.tesla_commands_today.
field_car_name: { en: "Car", nl: "Auto" }
field_car_description: { en: "Empty = automatic; otherwise the prefix of the car.", nl: "Leeg = automatisch; anders de prefix van de auto." }
title_no_cable: { en: "No charge cable to unlock", nl: "Geen laadkabel om te ontgrendelen" }
message_no_cable: { en: "No Tesla is plugged in at home.", nl: "Geen Tesla hangt thuis aan de kabel." }
title_which_cable: { en: "Which charge cable?", nl: "Welke laadkabel?" }
message_which_cable: { en: "Several Teslas are plugged in.", nl: "Meerdere Tesla's hangen aan een kabel." }
button_all: { en: "All", nl: "Alle" }
log_cable_unlocked: { en: "charge cable unlocked", nl: "laadkabel ontgrendeld" }
log_cable_not_unlocked:
  en: "charge cable NOT unlocked (no confirmation within 30 s)"
  nl: "laadkabel NIET ontgrendeld (geen bevestiging binnen 30 s)"
title_cable_unlocked: { en: "{car}: charge cable unlocked", nl: "{car}: laadkabel ontgrendeld" }
title_cable_not_unlocked: { en: "{car}: charge cable not unlocked", nl: "{car}: laadkabel niet ontgrendeld" }
message_cable_unlocked: { en: "You can pull the plug.", nl: "Je kan de stekker uittrekken." }
message_cable_not_unlocked:
  en: "No confirmation from the car within 30 s. Try the Tesla app."
  nl: "Geen bevestiging van de auto binnen 30 s. Probeer de Tesla-app."

# --- scripts leaving and leaving_<car>; {the_car} is filled in at fill time ---
leaving_alias: { en: "Leaving", nl: "Vertrekken" }
leaving_description:
  en: >-
    Open the gate and unlock the charge cable, in one tap. Without car: the Tesla that is plugged in at home (with
    several, a notification asks which one). With car: only that car.
  nl: >-
    Poort openen en de laadkabel ontgrendelen, in één tik. Zonder auto: de Tesla die thuis aan de kabel hangt
    (bij meerdere vraagt een melding welke). Met auto: enkel die auto.
leaving_car_alias: { en: "Leaving with {the_car}", nl: "Vertrekken met {the_car}" }
leaving_car_description:
  en: Open the gate and unlock the charge cable of {the_car}, in one tap.
  nl: Poort openen en de laadkabel van {the_car} ontgrendelen, in één tik.
