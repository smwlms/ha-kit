message_coming_home: { en: "{The_car} is coming home.", nl: "{The_car} komt thuis." }
title_ask_open: { en: "Open the gate?", nl: "Poort openen?" }
message_ask_destination:
  en: "{The_car} is approaching with destination {dest}, so the gate will not open by itself."
  nl: "{The_car} nadert met als bestemming {dest}, dus de poort gaat niet vanzelf open."
message_ask_no_navigation:
  en: "{The_car} is approaching without navigating home, so the gate will not open by itself."
  nl: "{The_car} nadert zonder navigatie naar huis, dus de poort gaat niet vanzelf open."
message_ask_short_trip:
  en: "{The_car} is navigating home after a short trip, so the gate will not open by itself."
  nl: "{The_car} navigeert naar huis na een korte rit, dus de poort gaat niet vanzelf open."

# --- automation gate_notification_action ---
notification_action_alias: { en: "Gate notification buttons", nl: "Poort meldingsknoppen" }
notification_action_description:
  en: >-
    Buttons 'Close gate' (GATE_CLOSE) and 'Open gate' (GATE_OPEN) from the gate notifications, on every phone.
  nl: >-
    Knoppen 'Sluit poort' (GATE_CLOSE) en 'Open poort' (GATE_OPEN) uit de poortmeldingen, op elke gsm.
notification_action_description_sensor:
  en: >-
    Close runs script.gate_close_manual (close until it is closed: no pulse while the gate moves, at most 2 pulses)
    only when binary_sensor.gate_open reports open (a pulse on a closed gate opens it); then whoever pressed gets
    'Gate is closed' or 'not closed yet' (with a garage camera: 'closed' comes from automation.gate_closed_photo).
  nl: >-
    Sluiten start script.gate_close_manual (sluiten tot ze dicht is: geen puls zolang de poort beweegt, max. 2
    pulsen), enkel als binary_sensor.gate_open 'open' meldt (een puls op een dichte poort opent ze); daarna krijgt
    wie drukte 'Poort is dicht' of 'nog niet dicht' (met een garagecamera komt 'dicht' van automation.gate_closed_photo).
notification_action_description_no_sensor:
  en: Without a gate sensor closing always pulses and whoever pressed only gets 'Pulse given'.
  nl: Zonder poortsensor geeft sluiten altijd een puls en krijgt wie drukte enkel 'Puls gegeven'.
notification_action_description_parallel:
  en: Parallel, so two people pressing both get an answer; the second waits for the first closing and gives no pulse.
  nl: Parallel, zodat twee mensen die drukken allebei antwoord krijgen; de tweede wacht op de eerste sluiting en geeft geen puls.
title_already_closed: { en: "Gate already closed", nl: "Poort is al dicht" }
reason_close_notification: { en: "close from notification", nl: "sluiten via melding" }
message_closed_at: { en: "Closed at {time}.", nl: "Gesloten om {time}." }
message_not_closed_after_tries:
  en: "Home Assistant tried to close the gate (at most {pulses} pulses), but it still does not report closed. Please check."
  nl: "Home Assistant probeerde de poort te sluiten (max. {pulses} pulsen), maar ze meldt nog geen eindstand dicht. Kijk even na."
title_pulse_given: { en: "Pulse given", nl: "Puls gegeven" }
message_pulse_given_no_sensor:
  en: "At {time}. Without a gate sensor Home Assistant does not know whether the gate is closed."
  nl: "Om {time}. Zonder poortsensor weet Home Assistant niet of de poort dicht is."

# --- automation gate_open_too_long ---
open_too_long_alias: { en: "Gate open too long", nl: "Poort staat te lang open" }
open_too_long_description:
  en: >-
    Notifies everyone when binary_sensor.gate_open has been open longer than input_number.gate_open_alert_minutes,
    with the button 'Close gate' (GATE_CLOSE) and a photo of that moment when entities.garage_camera is filled in.
    Repeats while the gate stays open (at most 6 times). When the gate closes, the notification disappears.
  nl: >-
    Meldt aan iedereen als binary_sensor.gate_open langer dan input_number.gate_open_alert_minutes open staat, met
    de knop 'Sluit poort' (GATE_CLOSE) en een foto van dat moment als entities.garage_camera ingevuld is. Herhaalt
    zolang de poort open blijft (max. 6 keer). Gaat de poort dicht, dan verdwijnt de melding.
open_too_long_description_parcel:
  en: >-
    Stays silent while script.parcel_garage (module parcel-service) holds the gate open: that script reports
    itself when the gate does not close.
  nl: >-
    Zwijgt zolang script.parcel_garage (module parcel-service) de poort open houdt: dat script meldt zelf als
    de poort niet dichtgaat.
title_open_minutes: { en: "Gate has been open for {minutes} min", nl: "Poort staat al {minutes} min open" }
message_open_since: { en: "Open since {time}.", nl: "Open sinds {time}." }

# --- automation gate_closed_photo (gate sensor and garage camera); {camera} is filled in at fill time ---
closed_photo_alias: { en: "Gate closed: notification with photo", nl: "Poort dicht: melding met foto" }
closed_photo_description:
  en: >-
    When binary_sensor.gate_open goes from open to closed, whatever closed it (Home Assistant, the remote, Google
    Home, the wall button): a photo of that moment from {camera} and the notification 'Gate is closed' to everyone,
    with the button 'Open gate'. Fixed tag gate-closed, so the newest replaces the previous one. Switch:
    input_boolean.gate_closed_notify. While it is on, the closing flows of Home Assistant send no closed message.
  nl: >-
    Als binary_sensor.gate_open van open naar dicht gaat, wat ze ook sloot (Home Assistant, de afstandsbediening,
    Google Home, de wandknop): een foto van dat moment van {camera} en de melding 'Poort is dicht' aan iedereen, met
    de knop 'Open poort'. Vaste tag gate-closed, zodat de nieuwste de vorige vervangt. Schakelaar:
    input_boolean.gate_closed_notify. Zolang die aan staat, sturen de sluitflows van Home Assistant zelf geen
    dicht-melding.
closed_photo_description_parcel:
  en: Silent while script.parcel_garage (module parcel-service) runs; that script sends its own proof photo.
  nl: Zwijgt zolang script.parcel_garage (module parcel-service) loopt; dat script stuurt zelf een bewijsfoto.

# --- automation gate_close_after_departure ---
close_after_departure_alias: { en: "Gate: close after leaving", nl: "Poort sluiten na vertrek" }
close_after_departure_description:
  en: >-
    A Tesla drives off and gets further than input_number.gate_close_distance from zone.home while
    binary_sensor.gate_open reports open. When another Tesla is leaving too (near home and in D/R or speed > 2 km/h),
    it waits until that one is out as well (at most 3 min, otherwise nothing). Then: is the gate moving
    (binary_sensor.gate_moving: a pulse or an opening less than the travel time ago, also from a remote, Google Home
    or the relay's app)? No pulse, wait for closed. Otherwise, with a garage camera and an AI service, two photos
    decide (script.gate_photo_check): closing = wait; open or half open = close; opening, closed or unsure = no pulse.
    Without camera or AI: close. Closing = script.gate_close_manual (close until it is closed). Then a notification
    to whoever left (phones, else the usual driver), with a photo of that moment when there is a camera.
    Switch: input_boolean.gate_auto_close_enabled. In test mode no pulse: 'Gate would close'.
  nl: >-
    Een Tesla rijdt weg en komt verder dan input_number.gate_close_distance van zone.home terwijl
    binary_sensor.gate_open 'open' meldt. Rijdt een andere Tesla ook weg (bij huis en in D/R of snelheid > 2 km/u),
    dan wacht ze tot die ook buiten is (max. 3 min, anders niets). Dan: beweegt de poort (binary_sensor.gate_moving:
    een puls of een opening minder dan de looptijd geleden, ook via afstandsbediening, Google Home of de app van het
    relais)? Geen puls, wachten op dicht. Anders beslissen, met een garagecamera en een AI-dienst, twee foto's
    (script.gate_photo_check): sluit = wachten; open of half open = sluiten; opent, dicht of onzeker = geen puls.
    Zonder camera of AI: sluiten. Sluiten = script.gate_close_manual (sluiten tot ze dicht is). Daarna een melding
    aan wie vertrok (gsm's, anders de vaste bestuurder), met een foto van dat moment als er een camera is.
    Schakelaar: input_boolean.gate_auto_close_enabled. In testmodus geen puls: 'Poort zou sluiten'.
