# --- shared words ---
and: { en: "and", nl: "en" }
unknown: { en: "unknown", nl: "onbekend" }
button_close_gate: { en: "Close gate", nl: "Sluit poort" }
button_open_gate: { en: "Open gate", nl: "Open poort" }
gate_closed: { en: "Gate is closed", nl: "Poort is dicht" }
gate_not_closed_yet: { en: "Gate not closed yet", nl: "Poort is nog niet dicht" }
no_pulse_given: { en: "No pulse given.", nl: "Geen puls gegeven." }
test_no_pulse: { en: "Test mode: no pulse given.", nl: "Testmodus: geen puls gegeven." }
