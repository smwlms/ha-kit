# User-facing texts of the module home-screen: one key per text, {en: ..., nl: ...}. tools/fill.py picks
# house.language (default en); _home_screen.jinja passes every key listed in string_keys into the card config as
# strings:, and www/home-screen.js reads them as S.<key>. {placeholders} stay in the text and are filled in by the card
# in the browser (fmt()); keep them when you translate. Add a key here AND in string_keys of _home_screen.jinja.

