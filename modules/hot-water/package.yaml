<% from '_hot_water.jinja' import tariff_on, bath, battery with context %>
<# Helpers of the module. Uploaded by hot-water/deploy.py to /config/packages/hot_water.yaml. No `initial`: deploy.py
   sets the defaults of module.yaml once, after that the value is the user's. Helpers of an optional block only exist
   with that block (price: a tariff module; bath: hot_water.bath; battery: entities.battery_soc). #>
# Hot water buffer: helpers (ha-kit module hot-water, see hot-water/LOGIC.md).
# Filled in from house.yaml by tools/fill.py: change house.yaml and deploy again, do not edit this file in HA.
input_boolean:
  hot_water_on_surplus: # master switch: off = the module does nothing, the heater follows its own schedule
    name: <@ t('helper_on_surplus') | tojson @>
    icon: mdi:water-boiler-auto
  hot_water_surplus_active: # session marker, set only by automation hot_water_buffer (do not switch it yourself)
    name: <@ t('helper_surplus_active') | tojson @>
    icon: mdi:water-boiler-alert
  hot_water_shower_tomorrow: # morning goal = shower temperature; switches itself off at sunrise
    name: <@ t('helper_shower_tomorrow') | tojson @>
    icon: mdi:shower-head
<% if tariff_on %>
  hot_water_price_aware: # on = heat on surplus only when binary_sensor.hot_water_heating_pays is on
    name: <@ t('helper_price_aware') | tojson @>
    icon: mdi:cash-clock
<% endif %>

input_number:
  hot_water_minimum: # the tank has at least this at sunrise; also the target of the heater outside a session
    name: <@ t('helper_minimum') | tojson @>
    icon: mdi:thermometer-low
    min: 30
    max: 55
    step: 1
    unit_of_measurement: "°C"
    mode: slider
  hot_water_shower: # morning goal with the shower button on
    name: <@ t('helper_shower') | tojson @>
    icon: mdi:shower-head
    min: 35
    max: 55
    step: 1
    unit_of_measurement: "°C"
    mode: slider
  hot_water_surplus_max: # target of a surplus or cheap-power session (above ~60 °C many heat pumps use the element)
    name: <@ t('helper_surplus_max') | tojson @>
    icon: mdi:thermometer-high
    min: 40
    max: 75
    step: 1
    unit_of_measurement: "°C"
    mode: slider
  hot_water_surplus_from_kw: # a session starts only when the 10-minute export average is above this
    name: <@ t('helper_surplus_from_kw') | tojson @>
    icon: mdi:transmission-tower-export
    min: 0.1
    max: 5
    step: 0.1
    unit_of_measurement: kW
    mode: box
<% if battery %>
  hot_water_battery_minimum: # the battery first: below this the tank waits, unless the solar plan has room for both
    name: <@ t('helper_battery_minimum') | tojson @>
    icon: mdi:battery-high
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
<% endif %>
<% if bath %>
  hot_water_bath: # the tank has at least this at the bath check
    name: <@ t('helper_bath') | tojson @>
    icon: mdi:bathtub
    min: 35
    max: 65
    step: 1
    unit_of_measurement: "°C"
    mode: slider
<% endif %>
<% if tariff_on %>
  hot_water_heat_value: # heating on surplus pays when export price < this x price of the cheapest 2 h coming
    name: <@ t('helper_heat_value') | tojson @>
    icon: mdi:scale-balance
    min: 0.3
    max: 1.5
    step: 0.05
    mode: slider
  hot_water_cheap_max_grid_kw: # during cheap power a session may take this much from the grid
    name: <@ t('helper_cheap_max_grid_kw') | tojson @>
    icon: mdi:transmission-tower-import
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kW
    mode: box
  hot_water_cheap_stop_min: # ... for at most this many minutes in a row, then it stops
    name: <@ t('helper_cheap_stop_min') | tojson @>
    icon: mdi:timer-outline
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box
<% endif %>
<% if bath %>

input_datetime:
  hot_water_bath_check: # bath goal checked here; below the bath temperature: heat now (safety net)
    name: <@ t('helper_bath_check') | tojson @>
    icon: mdi:bathtub-outline
    has_date: false
    has_time: true
<% endif %>
