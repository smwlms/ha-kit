# --- sensors ---
sensor_energy_needed: { en: "Hot water: energy to the maximum", nl: "Warm water: energie tot het maximum" }
sensor_room: { en: "Hot water: room in the solar plan", nl: "Warm water: ruimte in het zonneplan" }
sensor_expected_export: { en: "Hot water: export expected anyway", nl: "Warm water: verwachte injectie" }
