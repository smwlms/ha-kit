# --- Script parcel_expected ---
day_alias: { en: "Parcel service: choose the day", nl: "Pakjesdienst: dag kiezen" }
day_description:
  en: >-
    Sets input_datetime.parcel_expected to today or tomorrow, or to 'off' (01-01-2000, a day in the past). On the
    chosen day a ring gives a critical notification with the button 'Garage ajar (N s)' (or 'Garage open' when ajar
    is 0), and when Gemini sees a parcel or courier the garage opens ajar by itself (automation doorbell_ring). After
    that day it no longer applies by itself. See parcel-service/LOGIC.md.
  nl: >-
    Zet input_datetime.parcel_expected op vandaag of morgen, of op 'uit' (01-01-2000, een dag in het verleden). Op de
    gekozen dag geeft aanbellen een kritieke melding met de knop 'Garage op een kier (N s)' (of 'Garage open' als de
    kier op 0 staat), en ziet Gemini een pakje of koerier, dan gaat de garage vanzelf op een kier
    (automation doorbell_ring). Na die dag geldt het vanzelf niet meer. Zie parcel-service/LOGIC.md.
field_day_name: { en: Day, nl: Dag }
field_day_description: { en: "today, tomorrow or off", nl: "vandaag, morgen of uit" }
day_today: { en: Today, nl: Vandaag }
day_tomorrow: { en: Tomorrow, nl: Morgen }
day_off: { en: "Off", nl: Uit }
log_day_today: { en: "parcel expected today ({date}) · dashboard", nl: "pakje verwacht vandaag ({date}) · dashboard" }
log_day_tomorrow: { en: "parcel expected tomorrow ({date}) · dashboard", nl: "pakje verwacht morgen ({date}) · dashboard" }
log_day_off: { en: off · dashboard, nl: uit · dashboard }

