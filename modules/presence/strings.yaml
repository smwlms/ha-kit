# User-facing texts of the module presence ("Our week"), one key per text: {en: ..., nl: ...}. Used in the module's
# files as <@ t('key', name=...) @> (tools/fill.py picks house.language, default en; a missing language falls back to
# en with a warning). A {placeholder} that is not filled in at fill time stays in the text and is replaced at run
# time (Home Assistant templates, the card, the Python scripts).
#
# Calendar titles and the "key: value" lines of an event are READ BACK by the card, the automation arrival_learn and
# backfill.py. They accept the texts of EVERY language in this file, so events written before a language switch keep
# working. Changing an existing text below means old events with the old text are no longer recognised: add a
# language instead of rewording one. Texts in the card are JavaScript string literals: no line breaks.

