src_history_car_at_work: { en: "history (afterwards), {car} in the work zone", nl: "historiek (achteraf), {car} in de werkzone" }
src_history_source: { en: "history (afterwards), {source}", nl: "historiek (achteraf), {source}" }
# Stays calendar ("Stay: <name>", one all-day event per person and day): description labels.
stay_spots: { en: spots, nl: plekken }
