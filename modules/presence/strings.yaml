# --- Script presence_log --------------------------------------------------------------------------------------------------
script_alias: { en: Log presence, nl: Aanwezigheid loggen }
script_description:
  en: >-
    Writes an arrival, school run, working day or charging session as an event in {calendar} and in the logbook.
    Can also be used by hand to add a missed run. See presence/LOGIC.md.
  nl: >-
    Schrijft een thuiskomst, schoolrit, werkdag of laadbeurt als afspraak in {calendar} en in het logboek. Ook met de
    hand te gebruiken om een gemiste rit toe te voegen. Zie presence/LOGIC.md.
field_kind: { en: Kind, nl: Soort }
field_people: { en: Who, nl: Wie }
field_people_example: { en: "For example {example}", nl: "Bijvoorbeeld {example}" }
field_start: { en: Time, nl: Tijdstip }
field_end: { en: End, nl: Einde }
field_end_description: { en: Empty = time + 1 min, nl: Leeg = tijdstip + 1 min }
field_details: { en: Details, nl: Details }
field_details_description:
  en: "One \"key: value\" per line (place, car, source, away, duration …)"
  nl: "Eén \"sleutel: waarde\" per regel (plek, auto, bron, weg, duur …)"

# --- Automations: alias and description -----------------------------------------------------------------------------------
track_alias: { en: "Presence: track departures and work", nl: "Aanwezigheid: vertrek en werk bijhouden" }
track_description:
  en: >-
    Sets the timestamps the other presence automations read: leaving home, leaving work, and when a Tesla left the
    school or family zone. Also remembers the last navigation destination per Tesla (for the name of a
    Supercharger). See presence/LOGIC.md.
  nl: >-
    Zet de tijdstempels die de andere aanwezigheids-automatiseringen lezen: vertrek van thuis, vertrek van het werk,
    en wanneer een Tesla de school- of familiezone verliet. Onthoudt ook de laatste navigatiebestemming per Tesla
    (voor de naam van een supercharger). Zie presence/LOGIC.md.
arrival_alias: { en: "Presence: log arrival", nl: "Aanwezigheid: thuiskomst loggen" }
arrival_description:
  en: >-
    Logs every arrival at home (person entity) after at least 10 min away. "Home from work" when the person left
    their own work zone during this absence.{cars} See presence/LOGIC.md.
  nl: >-
    Logt elke thuiskomst (person-entiteit) na minstens 10 min weg. "Thuis van werk" als de persoon tijdens dit
    vertrek de eigen werkzone verliet.{cars} Zie presence/LOGIC.md.
arrival_description_cars: { en: " The car that also came home within 5 min is in the details.", nl: " De auto die binnen 5 min ook thuiskwam, staat in de details." }
run_car_alias: { en: "Presence: school run by Tesla", nl: "Aanwezigheid: schoolrit met de Tesla" }
run_car_description_school:
  en: "A Tesla stands at least 2 min in the zone {zone} during a window of schedule.school_drop_off or schedule.school_pick_up{drop_off}."
  nl: "Een Tesla staat minstens 2 min in de zone {zone} tijdens een venster van schedule.school_drop_off of schedule.school_pick_up{drop_off}."
run_car_description_drop_off: { en: ", within 100 m of a drop-off point", nl: ", binnen 100 m van een afzetpunt" }
run_car_description_family:
  en: >-
    {start} 2 min in a family zone ({zones}) during schedule.family_pick_up: then it is a "Pick-up" at family, unless
    the children were already picked up today after 11:00 (then it is a visit){school}.
  nl: >-
    {start} 2 min in een familiezone ({zones}) tijdens schedule.family_pick_up: dan is het "Halen" bij familie, tenzij
    de kinderen vandaag na 11:00 al gehaald werden (dan is het een bezoek){school}.
run_car_description_family_or: { en: Or, nl: Of }
run_car_description_family_start: { en: A Tesla stands, nl: Een Tesla staat }
run_car_description_family_school: { en: " or the same car is at school within 20 min (then that run counts)", nl: " of dezelfde auto binnen 20 min aan school staat (dan telt die rit)" }
run_car_description_who:
  en: >-
    Who: phones with the car (same zone or <= 300 m), otherwise the usual driver unless that phone is elsewhere.
    Driving past (40-70 s measured) drops out this way. See presence/LOGIC.md.
  nl: >-
    Wie: gsm's bij de auto (zelfde zone of <= 300 m), anders de vaste bestuurder tenzij die gsm elders is.
    Doorrijden (40-70 s gemeten) valt zo weg. Zie presence/LOGIC.md.
run_phone_alias: { en: "Presence: school run without Tesla", nl: "Aanwezigheid: schoolrit zonder Tesla" }
run_phone_description:
  en: >-
    A person stands at least 3 min in the zone {zones} during the window (schedule.school_drop_off,
    schedule.school_pick_up or schedule.family_pick_up){no_tesla}. Not logged{tesla_passed} when the person already
    had a school run in the last 45 min, or (family) when the children were already picked up today. See
    presence/LOGIC.md.
  nl: >-
    Een persoon staat minstens 3 min in de zone {zones} tijdens het venster (schedule.school_drop_off,
    schedule.school_pick_up of schedule.family_pick_up){no_tesla}. Niet gelogd{tesla_passed} als de persoon al een
    schoolrit had in de laatste 45 min, of (familie) als de kinderen vandaag al gehaald werden. Zie presence/LOGIC.md.
run_phone_description_no_tesla: { en: " and no Tesla is there", nl: " en er staat geen Tesla" }
run_phone_description_tesla_passed: { en: " when a Tesla just drove through the zone (the phone was probably in that car),", nl: " als een Tesla net door de zone reed (gsm zat vermoedelijk in die auto)," }
word_or: { en: or, nl: of }
workday_alias: { en: "Presence: log working day", nl: "Aanwezigheid: werkdag loggen" }
workday_description:
  en: >-
    A working day runs from the first arrival in the work zone to the last departure before getting home. Leaving
    the work zone in between and coming back without having been home is a work trip: that counts as work.
    Appointments after work (standing still >= 10 min outside every zone, sensor.presence_workday) are work trips too:
    the working day then ends at the departure from the last appointment. The event "{title}: <name>" goes into
    {calendar} on getting home, or at 23:55 when you do not get home. See presence/LOGIC.md.
  nl: >-
    Een werkdag loopt van de eerste aankomst in de werkzone tot het laatste vertrek vóór je thuiskomt. Wie
    tussendoor de werkzone verlaat en terugkomt zonder thuis te zijn geweest, maakt een werkverplaatsing: dat telt
    als werk. Afspraken na het werk (stilstaan >= 10 min buiten elke zone, sensor.presence_workday) zijn ook
    werkverplaatsingen: de werkdag eindigt dan bij het vertrek van de laatste afspraak. De afspraak "{title}: <naam>"
    komt in {calendar} bij thuiskomst, of om 23:55 als je niet thuiskomt. Zie presence/LOGIC.md.
supercharger_alias: { en: "Presence: log Supercharger sessions", nl: "Aanwezigheid: laden aan de supercharger loggen" }
supercharger_description:
  en: >-
    When a Tesla starts charging away from home, this automation remembers the time and the battery level. When the
    cable comes out, it logs "{title}: <name>" from start to end if the battery rose at least 20 %/h (fast
    charging). Who: phone with the car, otherwise the usual driver, otherwise "{unknown}". See presence/LOGIC.md.
  nl: >-
    Begint een Tesla te laden buiten thuis, dan onthoudt deze automatisering het uur en het batterijniveau. Gaat de
    laadkabel eruit, dan logt ze "{title}: <naam>" van begin tot einde als de batterij minstens 20 %/u steeg
    (snelladen). Wie: gsm bij de auto, anders de vaste bestuurder, anders "{unknown}". Zie presence/LOGIC.md.
stays_alias: { en: "Presence: save stays", nl: "Aanwezigheid: verblijfplaatsen opslaan" }
stays_description:
  en: >-
    Every night at 00:10: sensor.presence_stays (command_line, presence/stay.py) works out the last 3 days from the
    recorder, and every day/person not yet in {calendar} is added as an all-day event "{title}: <name>". A missed
    night is caught up the next night this way. See presence/LOGIC.md.
  nl: >-
    Elke nacht om 00:10: sensor.presence_stays (command_line, presence/stay.py) rekent de laatste 3 dagen uit de
    recorder uit, en elke dag/persoon die nog niet in {calendar} staat, komt erbij als afspraak "{title}: <naam>" over
    de hele dag. Een gemiste nacht wordt zo de volgende nacht ingehaald. Zie presence/LOGIC.md.
learn_alias: { en: Learn arrival time per weekday from Our week, nl: Thuiskomst per weekdag leren uit Onze week }
learn_description:
  en: >-
    Every night: earliest real arrival per day from {calendar} (last 8 weeks). Counts "{home}…" after >= 1 h away and
    "{pick_up}" + 10 min, between 11:00 and 21:00. Earliest of the last 4 same weekdays, rounded down to a quarter of
    an hour, to input_datetime.arrival_<day> once there are >= 3 days. See presence/LOGIC.md.
  nl: >-
    Elke nacht: vroegste echte thuiskomst per dag uit {calendar} (laatste 8 weken). Telt "{home}…" na >= 1 u weg en
    "{pick_up}" + 10 min, tussen 11 en 21 u. Vroegste van de laatste 4 dezelfde weekdagen, afgerond naar beneden op
    een kwartier, naar input_datetime.arrival_<dag> zodra er >= 3 dagen zijn. Zie presence/LOGIC.md.

