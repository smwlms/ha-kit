kind_pick_up: { en: Pick-up, nl: Halen }
kind_work: { en: Work, nl: Werk }
kind_charge: { en: Charging, nl: Laden }
kind_stay: { en: Stay, nl: Verblijf }
# Between two names in a title or a sentence ("Jan and Lien").
word_and: { en: and, nl: en }

