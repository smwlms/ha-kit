# Room sensor = DIY "Everything Presence Lite" + SHT31 (temperature/humidity). Shared base for every room.
#
# Hardware (per room): ESP32 DevKit (CP2102, esp32dev) + HLK-LD2450 + BH1750 + GY-SHT31-D.
# The EP Lite uses exactly the same pins as a plain ESP32 DevKit, so its firmware packages are reused:
#   LD2450: 5V -> VIN, GND -> GND, TX -> GPIO16 (RX2), RX -> GPIO17 (TX2)
#   BH1750 + SHT31 on I2C bus_a: SDA GPIO21, SCL GPIO22, VCC 3V3, GND. ADDR pins open (0x23 / 0x44).
# Keep the SHT31 in the separate vented chamber of the printed case (3d/room-sensor-enclosure.scad);
# the ESP32 warms up and would bias the temperature.
#
# Not a device on its own: included per room by kamersensor-<room>.yaml (generated by the kit from room.yaml)
# with the vars name / friendly_name / temp_offset. Both files must sit in the same folder (/config/esphome/).
# The EP Lite "Everything Presence" zone editor in HA works with this firmware (same entities).
# The four entities added here (temperature, humidity, offset, update) are named in house.language (strings.yaml);
# the EP Lite entities keep their English names.

substitutions:
  illuminance_update_interval: "2s"
  hidden_ssid: "false"
  log_level: INFO
  device_config:
    ethernet_enabled: false
    co2_enabled: false
    bluetooth_enabled: false
    board_revision: "1.2"
    sensor_variant: "ld2450"
    firmware_channel: "stable"
    model: "everything-presence-lite"

packages:
  everything_presence_lite:
    url: https://github.com/EverythingSmartHome/everything-presence-lite
    ref: 107478e7b725513a5d7a7d4af725234f140d4804 # main on 2026-09-27 - pin, do not follow main
    refresh: 1000d
    files:
      - common/everything-presence-lite-base.yaml
      - common/ld2450-base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret room_sensor_api_encryption_key

ota:
  - platform: esphome
    id: !extend ota_esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret wifi_hotspot_password

captive_portal:

# The EP Lite base references `update_http_request`. Point it nowhere and keep it internal:
# the official EP Lite firmware has no SHT31, so an update from their manifest would drop it.
update:
  - platform: http_request
    id: update_http_request
    name: "<@ t('entity_firmware_update') @>"
    source: https://updates.invalid/kamersensor-manifest.json
    update_interval: never
    internal: true

number:
  - platform: template
    name: "<@ t('entity_temperature_offset') @>"
    id: temp_offset_ui
    unit_of_measurement: "°C"
    min_value: -5
    max_value: 5
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${temp_offset}
    icon: mdi:thermometer-lines
    entity_category: config

sensor:
  - platform: sht3xd
    i2c_id: bus_a
    address: 0x44
    update_interval: 30s
    heater_enabled: false
    temperature:
      name: "<@ t('entity_temperature') @>"
      id: room_temperature
      accuracy_decimals: 1
      filters:
        - lambda: return x + id(temp_offset_ui).state;
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
    humidity:
      name: "<@ t('entity_humidity') @>"
      id: room_humidity
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 2
