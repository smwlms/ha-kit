<# Source for one room (generate in module.yaml): rendered once per room with sensor: true, item = that room. #>
<# safe_name: the slug becomes the device name and the file name /config/esphome/kamersensor-<slug>.yaml #>
<% set node = 'kamersensor-' ~ (safe_name(item.slug, 'rooms[].slug') | replace('_', '-')) %>
<% set offset = item.get('temp_offset', -0.5) %>
<% if offset is not number %><@ fail('rooms: temp_offset of ' ~ item.slug ~ ' must be a number, e.g. -0.5') @><% endif %>
# Room sensor <@ item.name @> (ESP32 + LD2450 + BH1750 + SHT31), USB-powered. Base: kamersensor.yaml.
# Generated by ha-kit (module room-sensor) from house.yaml, rooms[slug=<@ item.slug @>].
# Device name <@ node @>; entity ids follow the friendly name, e.g. sensor.<@ item.name | lower | replace(' ', '_') @>_<@ t('entity_temperature') | lower | replace(' ', '_') @>.
packages:
  room_sensor: !include
    file: kamersensor.yaml
    vars:
      name: <@ node @>
      friendly_name: "<@ item.name @>"
      temp_offset: "<@ offset @>" # calibrate against a reference thermometer after a day (also adjustable in HA)
