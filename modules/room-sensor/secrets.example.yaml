# Example of the keys this module needs in /config/esphome/secrets.yaml (ESPHome Device Builder > Secrets).
# Placeholders only: fill in your own values in Home Assistant, never in the kit. deploy.py does not upload secrets.
# Keys shared by all ESPHome modules of the kit (room-sensor, ventilation-zehnder, spa-spanet):
wifi_ssid: "name-of-your-wifi"
wifi_password: "password-of-your-wifi"
wifi_hotspot_password: "choose-a-password-for-the-fallback-hotspot"
ota_password: "choose-an-ota-password"
# Module room-sensor: one key for all room sensors. Make one with: openssl rand -base64 32
# (older versions of the kit called it kamersensor_api_encryption_key: copy that value)
room_sensor_api_encryption_key: "paste-a-base64-key-of-32-bytes-here"
