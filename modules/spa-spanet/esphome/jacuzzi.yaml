<# Template of the kit: filled in by tools/fill.py from house.yaml (section spa:, all fields optional). Entity names,
   the Power Save options and the sleep timer text come from strings.yaml in house.language. #>
<% from '_spa.jinja' import device_name, friendly, probes, lid with context %>
<% if (device_name | string | lower) != (device_name | string) or ' ' in device_name or '_' in device_name %><@ fail('spa.name: only lower case letters, digits and hyphens, e.g. jacuzzi') @><% endif %>
# Spa (jacuzzi) with a SpaNET SV3 controller - ESP32 on the EXP1 expand port (ONLY SpaNET SV-series, see README).
#
# Wiring (README.md "Wiring" and fritzing/jacuzzi-gaatjesprint.png):
#   EXP1 pin 5 -> 220R -> GPIO16 (RX)      EXP1 pin 7 -> GND
#   EXP1 pin 6 -> 220R -> GPIO17 (TX)      EXP1 pin 8 -> step-down -> 3V3
#   EXP1 pin 1/2/7 may stay connected to a Vortex health badge (logo light), when present.
<% if probes %>
#   DS18B20 water probe: data -> GPIO4, DS18B20 air probe: data -> GPIO18 (one sensor per bus, so no
#   addresses needed); each bus 4.7k pull-up data -> 3V3; red -> 3V3, white -> GND.
<% endif %>
<% if lid %>
#   Lid: MC-38 reed contact (normally open, closes when the magnet on the lid is near)
#   between GPIO19 and GND; internal pull-up. Contact open = lid open.
<% endif %>
# MEASURE FIRST: idle level of pin 5/6 vs pin 7 must be ~3.3 V (at 5 V add a divider on RX).
#
# Protocol: plain text, 38400 8N1. "RF" returns the status registers R2..RG,
# "W40:380" sets 38.0 C, "W66:n" mode, "W63:n" power save, "W60:n" filtration hours,
# "W90:n" filtration cycle, "W12" sanitise. Field map: wayne-love/espyspa SpaInterface.cpp.
# Fields marked (raw) still need to be checked against the touchpad / an energy meter.
#
# Generated by ha-kit (module spa-spanet): probes=<@ probes | lower @>, lid=<@ lid | lower @>.

substitutions:
  device_name: <@ device_name @>
  friendly_name: "<@ friendly @>"
  poll_interval: 10s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: SpaNET SV3 via EXP1
  includes:
    - spanet.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    uart_debug: INFO

api:
  encryption:
    key: !secret spa_api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret wifi_hotspot_password

captive_portal:

globals:
  - id: last_rx_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

uart:
  id: spa_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 38400
  rx_buffer_size: 2048
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\n"
      timeout: 50ms
      bytes: 512
    sequence:
      - lambda: |-
          // Parsing lives in spanet.h (shared with test/spanet_test.cpp); here we only publish.
          static spanet::LineReader reader;
          static spanet::Status st;
          reader.feed(reinterpret_cast<const char *>(bytes.data()), bytes.size(), [&](const std::string &line) {
            const auto kind = spanet::parse_line(line, st);
            if (kind == spanet::Line::None) return;
            if (kind == spanet::Line::Reply) {
              ESP_LOGD("spanet", "reply: %s", line.c_str());  // answer to a W../S.. command
              return;
            }
            id(last_rx_ms) = millis();
            switch (kind) {
              case spanet::Line::R2:
                id(spa_mains_current).publish_state(st.mains_current);
                id(spa_mains_voltage).publish_state(st.mains_voltage);
                id(spa_case_temp).publish_state(st.case_temp);
                id(spa_heater_temp).publish_state(st.heater_temp);
                id(spa_water_present).publish_state(st.water_present == 1);
                break;
              case spanet::Line::R3:
                id(spa_current_limit).publish_state(st.current_limit);
                id(spa_firmware).publish_state(st.firmware);
                id(spa_model).publish_state(st.model);
                id(spa_status).publish_state(st.state);
                id(spa_heater_current).publish_state(st.heater_current);
                if (!std::isnan(st.mains_voltage))
                  id(spa_heater_power_calc).publish_state(st.heater_current * st.mains_voltage);
                break;
              case spanet::Line::R4:
                if (!st.mode.empty()) id(spa_mode).publish_state(st.mode);
                id(spa_power_raw).publish_state(st.power_raw);
                id(spa_energy_total_raw).publish_state(st.energy_total_raw);
                id(spa_energy_today_raw).publish_state(st.energy_today_raw);
                break;
              case spanet::Line::R5:
                id(spa_sleep_active).publish_state(st.sleep_active == 1);
                id(spa_heating).publish_state(st.heating == 1);
                id(spa_auto).publish_state(st.auto_filtration == 1);
                id(spa_water_temp).publish_state(st.water_temp);
                break;
              case spanet::Line::R6: {
                const char *psav_opts[] = {"<@ t('power_save_off') @>", "<@ t('power_save_low') @>", "<@ t('power_save_high') @>"};
                id(spa_filt_hours).publish_state(st.filt_hours);
                if (st.filt_cycle > 0) id(spa_filt_cycle).publish_state(std::to_string(st.filt_cycle));
                id(spa_setpoint).publish_state(st.setpoint);
                if (st.power_save >= 0) id(spa_power_save).publish_state(psav_opts[st.power_save]);
                id(spa_psav_window).publish_state(st.psav_window);
                id(spa_sleep1).publish_state(std::string("<@ t('sleep_timer_day') @> ") + st.sleep1_days + ", " + st.sleep1_window);
                id(spa_sleep2).publish_state(std::string("<@ t('sleep_timer_day') @> ") + st.sleep2_days + ", " + st.sleep2_window);
                break;
              }
              default:
                break;
            }
          });

script:
  # All serial traffic goes through this queue, so polls and commands never overlap.
  - id: spa_send
    mode: queued
    max_runs: 8
    parameters:
      cmd: string
    then:
      - if:
          condition:
            lambda: return !cmd.empty();
          then:
            - lambda: id(spa_uart).write_str("\n");
            - delay: 50ms
            - lambda: |-
                ESP_LOGD("spanet", "send: %s", cmd.c_str());
                id(spa_uart).write_str((cmd + "\n").c_str());
            - delay: 700ms # the RF reply is ~1 kB; 38400 baud needs ~300 ms

interval:
  - interval: ${poll_interval}
    then:
      - script.execute:
          id: spa_send
          cmd: "RF"

<% if probes %>
# ---------------------------------------------------------------- own probes
# The spa reports its water temperature only reliably while the pump circulates; these probes
# measure all the time, which is what the heat-loss model / planner needs.
one_wire:
  - platform: gpio
    id: ow_water
    pin: GPIO4
  - platform: gpio
    id: ow_air
    pin: GPIO18

<% endif %>
# ---------------------------------------------------------------- read-only

sensor:
<% if probes %>
  - platform: dallas_temp
    one_wire_id: ow_water
    name: "<@ t('probe_water_temperature') @>"
    id: probe_water_temp
    update_interval: 60s
    accuracy_decimals: 2
  - platform: dallas_temp
    one_wire_id: ow_air
    name: "<@ t('probe_air_temperature') @>"
    id: probe_air_temp
    update_interval: 60s
    accuracy_decimals: 1
<% endif %>
  - platform: template
    id: spa_water_temp
    name: "<@ t('water_temperature') @>"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: spa_heater_temp
    name: "<@ t('heater_temperature') @>"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: spa_case_temp
    name: "<@ t('case_temperature') @>"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: spa_mains_voltage
    name: "<@ t('mains_voltage') @>"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: spa_mains_current
    name: "<@ t('mains_current') @>"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: spa_heater_current
    name: "<@ t('heater_current') @>"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: spa_heater_power_calc
    name: "<@ t('heater_power') @>"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    id: spa_current_limit
    name: "<@ t('current_limit') @>"
    unit_of_measurement: A
    device_class: current
    entity_category: diagnostic
  - platform: template
    id: spa_power_raw
    name: "<@ t('power_raw') @>"
    entity_category: diagnostic
  - platform: template
    id: spa_energy_total_raw
    name: "<@ t('energy_total_raw') @>"
    entity_category: diagnostic
  - platform: template
    id: spa_energy_today_raw
    name: "<@ t('energy_today_raw') @>"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "<@ t('wifi_signal') @>"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
<% if lid %>
  - platform: gpio
    id: lid_open
    name: "<@ t('lid') @>"
    device_class: opening # on = open
    pin:
      number: GPIO19
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 2s # ignore the lid bouncing while it is being closed
<% endif %>
  - platform: template
    id: spa_heating
    name: "<@ t('heating') @>"
    device_class: heat
  - platform: template
    id: spa_sleep_active
    name: "<@ t('sleep_timer_active') @>"
  - platform: template
    id: spa_auto
    name: "<@ t('auto_filtration') @>"
    entity_category: diagnostic
  - platform: template
    id: spa_water_present
    name: "<@ t('water_present') @>"
    device_class: moisture
    entity_category: diagnostic
  - platform: template
    name: "<@ t('connected') @>"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(last_rx_ms) != 0 && millis() - id(last_rx_ms) < 60000;

text_sensor:
  - platform: template
    id: spa_status
    name: Status
  - platform: template
    id: spa_psav_window
    name: "<@ t('power_save_window') @>"
  - platform: template
    id: spa_sleep1
    name: "<@ t('sleep_timer_1') @>"
  - platform: template
    id: spa_sleep2
    name: "<@ t('sleep_timer_2') @>"
  - platform: template
    id: spa_firmware
    name: Firmware
    entity_category: diagnostic
  - platform: template
    id: spa_model
    name: Model
    entity_category: diagnostic

# ---------------------------------------------------------------- controls

number:
  - platform: template
    id: spa_setpoint
    name: "<@ t('target_temperature') @>"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 10
    max_value: 41
    step: 0.5
    mode: box
    set_action:
      - script.execute:
          id: spa_send
          cmd: !lambda 'return "W40:" + std::to_string((int) lroundf(x * 10));'
      - script.execute:
          id: spa_send
          cmd: "RF"
  - platform: template
    id: spa_filt_hours
    name: "<@ t('filtration_hours') @>"
    unit_of_measurement: h
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    entity_category: config
    set_action:
      - script.execute:
          id: spa_send
          cmd: !lambda 'return "W60:" + std::to_string((int) x);'
      - script.execute:
          id: spa_send
          cmd: "RF"

select:
  - platform: template
    id: spa_mode
    name: "<@ t('operating_mode') @>"
    options: ["NORM", "ECON", "AWAY", "WEEK"]
    set_action:
      - script.execute:
          id: spa_send
          cmd: !lambda |-
            const char *opts[] = {"NORM", "ECON", "AWAY", "WEEK"};
            for (int i = 0; i < 4; i++)
              if (x == opts[i]) return "W66:" + std::to_string(i);
            return std::string();
      - script.execute:
          id: spa_send
          cmd: "RF"
  - platform: template
    id: spa_power_save
    name: Power Save
    options: ["<@ t('power_save_off') @>", "<@ t('power_save_low') @>", "<@ t('power_save_high') @>"]
    set_action:
      - script.execute:
          id: spa_send
          cmd: !lambda |-
            const char *opts[] = {"<@ t('power_save_off') @>", "<@ t('power_save_low') @>", "<@ t('power_save_high') @>"};
            for (int i = 0; i < 3; i++)
              if (x == opts[i]) return "W63:" + std::to_string(i);
            return std::string();
      - script.execute:
          id: spa_send
          cmd: "RF"
  - platform: template
    id: spa_filt_cycle
    name: "<@ t('filtration_cycle') @>"
    options: ["1", "2", "3", "4", "6", "8", "12", "24"]
    entity_category: config
    set_action:
      - script.execute:
          id: spa_send
          cmd: !lambda 'return "W90:" + x;'
      - script.execute:
          id: spa_send
          cmd: "RF"

button:
  - platform: template
    name: "<@ t('sanitise_cycle') @>"
    on_press:
      - script.execute:
          id: spa_send
          cmd: "W12"
  - platform: restart
    name: "<@ t('restart') @>"
    entity_category: diagnostic
