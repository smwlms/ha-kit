# --- plug-in reminder (automations.yaml); {called}/{Called} at fill time, {level}/{limit} by the automation ---
reminder_alias: { en: "Car: plug-in reminder", nl: "Auto: insteken-herinnering" }
reminder_description:
  en: >-
    Reminds whoever is home to plug in a car: some minutes after it came home and in the evening, only when it stands
    in the garage (last garage photo of tesla-driveway-lock, else: at home), no cable is in and the battery is well
    below the charge limit. Plugging in clears the notification on every phone. See tesla-car-card/LOGIC.md.
  nl: >-
    Herinnert wie thuis is eraan een auto in te steken: enkele minuten na thuiskomst en 's avonds, enkel als hij in de
    garage staat (laatste garagefoto van tesla-driveway-lock, anders: thuis), er geen kabel in zit en de batterij
    ruim onder de laadlimiet zit. Insteken haalt de melding van elke telefoon. Zie tesla-car-card/LOGIC.md.
reminder_title: { en: "Plug in {called}", nl: "Steek {called} in" }
reminder_message:
  en: "{Called} is in the garage without a cable · {level} % (charge limit {limit} %)."
  nl: "{Called} staat in de garage zonder kabel · {level} % (laadlimiet {limit} %)."
reminder_message_home:
  en: "{Called} is home without a cable · {level} % (charge limit {limit} %)."
  nl: "{Called} staat thuis zonder kabel · {level} % (laadlimiet {limit} %)."
