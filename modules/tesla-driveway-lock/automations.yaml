<% from '_tesla_driveway_lock.jinja' import tdl, photo, ent, car_list, spots, on_close with context %>
# Tesla on the driveway gets locked: automations (ha-kit module tesla-driveway-lock, see tesla-driveway-lock/LOGIC.md).
# Written by tesla-driveway-lock/deploy.py through the config API (same as the automation editor).
# Cars come from house.yaml (cars[]). The decision and the lock command live in script.tesla_driveway_lock_car, the
# garage photo in script.tesla_garage_photo (scripts.yaml); these automations only say when.

# --- 1. A car stood unlocked at home for N min: decide and lock it when it is outside -----------------------------
- id: tesla_driveway_lock
  alias: "<@ t('lock_alias') @>"
  description: >-
    <@ t('lock_description') @>
<% if photo %>
    <@ t('lock_description_photo') @>
<% else %>
    <@ t('lock_description_gps') @>
<% endif %>
    <@ t('lock_description_tail') @>
  mode: parallel
  max: 4
  triggers:
<% for a in car_list %>
    - trigger: state
      entity_id: binary_sensor.tesla_driveway_<@ a.prefix @>_home_unlocked
      to: "on"
      for:
        minutes: "{{ states('input_number.tesla_driveway_lock_minutes') | int(15) }}"
      id: <@ a.prefix @>
<% endfor %>
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_driveway_lock_enabled
      state: "on"
  actions:
    - action: script.tesla_driveway_lock_car
      data:
        car: "{{ trigger.id }}"
        source: minutes
<% if photo %>

# --- 2. Garage photo when a car shifts into P at home (optional, tesla_driveway_lock.garage_photo) -----------------
- id: tesla_garage_arrival_photo
  alias: "<@ t('arrival_alias') @>"
  description: >-
    <@ t('arrival_description') @>
  mode: parallel
  max: 4
  triggers:
<% for a in car_list %>
    - trigger: state
      entity_id: <@ car_entity(a, 'shift_state') @>
      to: p
      id: <@ a.prefix @>
<% endfor %>
  variables:
    home:
<% for a in car_list %>
      "<@ a.prefix @>": ["<@ car_entity(a, 'location') @>", "<@ car_entity(a, 'located_at_home') @>"]
<% endfor %>
  conditions:
    - alias: The car is at home
      condition: template
      value_template: >-
        {% set h = home[trigger.id] %}
        {{ is_state(h[0], 'home') or is_state(h[1], 'on') }}
  actions:
    - alias: Wait a moment until the car stands still
      delay:
        seconds: 5
    - action: script.tesla_garage_photo
      data:
        car: "{{ trigger.id }}"
        why: park
<% endif %>
<% if on_close %>

# --- 3. The gate closed with a car unlocked at home: photo, and lock right away the car that stands outside ---------
# Closed in any way (automation, remote, wall button, app): binary_sensor.gate_open of module gate goes from on to off.
# Only the photo decides here; is it unsure, the lock after N min decides as usual (photo, else GPS).
- id: tesla_driveway_gate_closed
  alias: "<@ t('closed_alias') @>"
  description: >-
    <@ t('closed_description') @>
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id: binary_sensor.gate_open
      from: "on"
      to: "off"
  variables:
    # Cars that stand unlocked in P at home right now (binary_sensor.tesla_driveway_<car>_home_unlocked on).
    candidates: >-
      {% set ns = namespace(l=[]) %}
      {% for p in <@ car_list | map(attribute='prefix') | list | tojson @>
         if is_state('binary_sensor.tesla_driveway_' ~ p ~ '_home_unlocked', 'on') %}
        {% set ns.l = ns.l + [p] %}
      {% endfor %}
      {{ ns.l }}
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_driveway_lock_enabled
      state: "on"
    - alias: A car stands unlocked in P at home
      condition: template
      value_template: "{{ candidates | count > 0 }}"
  actions:
    - action: script.tesla_garage_photo
      data:
        car: "{{ candidates[0] }}"
        why: close
    - repeat:
        for_each: "{{ candidates }}"
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.tesla_driveway_lock_car
            data:
              variables:
                car: "{{ repeat.item }}"
                source: close
<% endif %>
