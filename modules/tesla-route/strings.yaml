# User-facing texts of the module tesla-route, one key per text: {en: ..., nl: ...}. Used in the module's files as
# <@ t('key') @> (tools/fill.py picks house.language, default en; a missing language falls back to en with a warning).
# The cards get them as JSON (<@ t('key') | tojson @> in www/*.js), so any character is allowed.
# {who}, {car}, {min}, ... stay in the text and are filled in by the card in the browser (fmt()); keep them when
# you translate. {the_car} is the car's name with its article ("the Red X", "de Rode X", or just "Blixem" with
# cars[].article: ""): never write an article before it yourself.

# --- formats ---
locale: { en: en-GB, nl: nl-BE } # numbers and times on the cards (BCP 47 tag for toLocaleString)
geocode_language: { en: en, nl: nl } # language of place names from Mapbox reverse geocoding
speed_unit: { en: km/h, nl: km/u }
and: { en: and, nl: en }

# --- both cards ---
map_unavailable: { en: Map not available., nl: Kaart niet beschikbaar. }
dest_home: { en: Home, nl: Thuis } # the Tesla favourite "Home" as shown on the cards
dest_work: { en: Work, nl: Werk } # the Tesla favourite "Work"

