# ---------------------------------------------------------------------------
# ComfoClime RMI: write guard + polling
# ---------------------------------------------------------------------------
script:
  # read all mapped TEMPCONFIG properties (22/1/x)
  - id: cc_poll
    mode: single
    then:
      - lambda: |-
          static const uint8_t props[] = {2, 3, 4, 5, 8, 9, 10, 11, 12, 13, 15, 16, 21, 29};
          for (auto p : props) ccrmi::client().get(0x16, 1, p);

<% endif %>
<% if sniffer or clime %>
switch:
<% if sniffer %>
  - platform: template
    name: "Sniff: log unknown frames"
    icon: mdi:magnify-scan
    entity_category: diagnostic
    # FIX: a template switch defaults to restore_mode ALWAYS_OFF, which called
    # turn_off_action at boot and silently disabled the sniffer. Now it boots ON.
    restore_mode: ALWAYS_ON
    lambda: return id(sniff_enabled);
    turn_on_action: [lambda: "id(sniff_enabled) = true;"]
    turn_off_action: [lambda: "id(sniff_enabled) = false;"]
  - platform: template
    name: "Sniff: log RMI traffic"
    icon: mdi:swap-horizontal
    entity_category: diagnostic
    disabled_by_default: true
    restore_mode: ALWAYS_OFF
    lambda: return id(sniff_rmi);
    turn_on_action: [lambda: "id(sniff_rmi) = true;"]
    turn_off_action: [lambda: "id(sniff_rmi) = false;"]

<% endif %>
<% if clime %>
  # ---------------- ComfoClime 24 control (RMI to node 12, unit 22 TEMPCONFIG) ----------------
  # State = value read back from the ComfoClime (no optimistic states).
  - platform: template
    id: cc_writes_allowed
    name: "ComfoClime: allow writes"
    icon: mdi:shield-lock-open-outline
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return ccrmi::client().writes_enabled();
    turn_on_action: [lambda: "ccrmi::client().set_writes_enabled(true);"]
    turn_off_action: [lambda: "ccrmi::client().set_writes_enabled(false);"]
  - platform: template
    id: cc_auto_season # 22/1/2
    name: "ComfoClime Automatic Season"
    icon: mdi:calendar-sync
    restore_mode: DISABLED # never act at boot; state comes from the read-back
    turn_on_action: [lambda: "ccrmi::client().set(2, 1, 1);"]
    turn_off_action: [lambda: "ccrmi::client().set(2, 0, 1);"]
  - platform: template
    id: cc_auto_comfort # 22/1/8 (on = profile/curve, off = manual temperature 22/1/13)
    name: "ComfoClime Automatic Comfort Temperature"
    icon: mdi:thermometer-auto
    restore_mode: DISABLED # never act at boot; state comes from the read-back
    turn_on_action: [lambda: "ccrmi::client().set(8, 1, 1);"]
    turn_off_action: [lambda: "ccrmi::client().set(8, 0, 1);"]
  - platform: template
    id: cc_heat_pump # 22/1/21 - HYPOTHESIS (0 = on, 1 = forced off), see LOGIC.md, Edge cases
    name: "ComfoClime Heat Pump"
    icon: mdi:heat-pump-outline
    restore_mode: DISABLED # never act at boot; state comes from the read-back
    turn_on_action: [lambda: "ccrmi::client().set(21, 0, 1);"]
    turn_off_action: [lambda: "ccrmi::client().set(21, 1, 1);"]

<% endif %>
button:
<% if sniffer %>
  - platform: template
    name: "Sniff: reset log budget"
    icon: mdi:restore
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: "id(sniff_budget) = 50;"
      - logger.log: {level: INFO, tag: sniff, format: "log budget reset to 50"}
<% endif %>
<% if clime %>
  - platform: template
    name: "ComfoClime: read settings"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - script.execute: cc_poll
  # read-only sweep of node 12's properties -> log tag ccdump (~170 GETs, ~20 s)
  - platform: template
    name: "ComfoClime: dump properties"
    icon: mdi:database-search
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          auto &c = ccrmi::client();
          int n = 0;
          for (uint8_t p : {1, 2, 3, 4, 5, 6, 7, 20}) { c.get(0x01, 1, p); n++; }  // NODE (GET only)
          for (uint8_t s = 1; s <= 2; s++) for (uint8_t p = 1; p <= 12; p++) { c.get(0x15, s, p); n++; }
          for (uint8_t p = 1; p <= 45; p++) { c.get(0x16, 1, p); n++; }  // TEMPCONFIG
          for (uint8_t p = 1; p <= 35; p++) { c.get(0x17, 1, p); n++; }  // HEATPUMP
          for (uint8_t u : {0x19, 0x1A}) for (uint8_t p = 1; p <= 8; p++) { c.get(u, 1, p); n++; }
          id(cc_dump_left) += n;
          ESP_LOGI("ccdump", "dump started: %d GETs queued", n);

<% endif %>
<% endif %>
