<% if sniffer or clime %>
interval:
<% if sniffer %>
  - interval: 60s
    then:
      - lambda: |-
          if (id(sniff_unique).state != id(sniff_unique_count))
            id(sniff_unique).publish_state(id(sniff_unique_count));
<% endif %>
<% if clime %>
  - interval: 60s
    then:
      - script.execute: cc_poll
  - interval: 50ms
    then:
      - lambda: |-
          auto &c = ccrmi::client();
          c.loop();
          if (c.last_status() != id(cc_rmi_status).state) id(cc_rmi_status).publish_state(c.last_status());

<% endif %>
