<# Template of the kit: filled in by tools/fill.py from house.yaml (section ventilation:). Entity names are English in
   every house.language: most come from the yoziru packages, the local additions follow them (README). #>
<% from '_ventilation.jinja' import v, clime, sniffer, suffix, friendly, web with context %>
<% if (v.name | string | lower) != (v.name | string) or ' ' in v.name or '_' in v.name %><@ fail('ventilation.name: only lower case letters, digits and hyphens, e.g. ventilation') @><% endif %>
# Ventilation (Zehnder ComfoAir Q) - M5Stack AtomS3 Lite + Mini CAN Unit on the ComfoNet bus.
#
# = yoziru/esphome-zehnder-comfoair pinned at ce62828 (the state of `main` on 2026-08-23; built with
#   ESPHome 2026.8.0), rebuilt from the individual package files, plus:
#   - ComfoCool PDOs 85/784/785/802 (disabled sensors; no answer on a bus without ComfoCool, harmless)
<% if clime %>
#   - ComfoClime 24 (ComfoNet node 12): passive PDO decoder + RMI client that reads its settings
#     every 60 s and writes them from HA, only while the switch "ComfoClime: allow writes" is on
#     (default off). Code: components/comfoclime/. See the module's LOGIC.md.
<% endif %>
<% if sniffer %>
#   - a small rate-limited sniffer that logs CAN frames nobody decodes (diagnosis only)
<% endif %>
#   Nothing here transmits on the bus except the package's own requests and commands<% if clime %> and the
#   ComfoClime RMI requests to node 12<% endif %>.
#
# Why not simply `packages: github://.../zehnder-comfoair-q-m5stack-atoms3.dashboard.yml`?
#   - `main` has changed since 2026-09-05: dashboard.yml no longer contains api/wifi/ota
#     secrets -> a fresh build of the old one-liner would drop the API. Pin the ref!
#   - canbus.yml has no `id:` on its canbus entry, so it cannot be `!extend`ed.
#     Therefore canbus.yml + base.yml are replicated locally (identical content) and
#     all other package files are pulled from GitHub at the pinned commit.
#
# Generated by ha-kit (module ventilation-zehnder): comfoclime=<@ clime | lower @>, sniffer=<@ sniffer | lower @>, mac suffix=<@ suffix | lower @>.

substitutions:
<% if suffix %>
  device_name: <@ v.name @> # + name_add_mac_suffix -> "<@ v.name @>-<last 6 hex of the MAC>"
<% else %>
  device_name: <@ v.name @>
<% endif %>
  friendly_name: "<@ friendly @>"
  device_description: Zehnder ComfoAir Q HRV (heat recovery ventilation) unit
  filter_time: 5s
  filter_send_every: "1"
  filter_window_size: "3"

packages:
  zehnder:
    url: https://github.com/yoziru/esphome-zehnder-comfoair
    ref: ce62828bf21bcaec3a530e97740fa322cc085526
    refresh: 1000d
    files:
      - packages/binary_sensors.yml
      - packages/board.yml
      - packages/button.yml
      - packages/climate.yml
      - packages/common.yml
      - packages/fan.yml
      - packages/select.yml
      - packages/sensors.yml
      - packages/switch.yml
      - packages/text_sensors.yml
      - boards/m5stack-atoms3.yml
      # NOT included (replicated below): packages/base.yml, packages/canbus.yml

external_components:
  - components: [zehnder_comfoair_q]
    source:
      type: git
      url: https://github.com/yoziru/esphome-zehnder-comfoair
      ref: ce62828bf21bcaec3a530e97740fa322cc085526
      path: components
    refresh: 1000d
<% if clime %>
  # local: ComfoClime 24 RMI client + climate entity (ComfoNet node 12)
  - source:
      type: local
      path: components
    components: [comfoclime]
<% endif %>

# ---------------------------------------------------------------------------
# From packages/base.yml @ ce62828 (identical, except device_name/friendly_name above)
# ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  name_add_mac_suffix: <@ suffix | lower @>
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: yoziru.esphome-zehnder-comfoair
    version: "2024.8.0"
<% if clime %>
  # --- added: ComfoClime RMI client (components/comfoclime) ---
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &c = ccrmi::client();
          c.set_canbus(id(comfonet));
          c.set_handler([](const std::vector<uint8_t> &cmd, ccrmi::Status st, const std::vector<uint8_t> &d) {
            if (cmd[0] != 0x01) return;  // SET results: logged by the client, read-back follows
            if (id(cc_dump_left) > 0) {
              id(cc_dump_left) -= 1;
              if (st == ccrmi::STATUS_OK)
                ESP_LOGI("ccdump", "%s = [%s] (%ld)", ccrmi::path(cmd).c_str(), ccrmi::hex(d).c_str(), (long) ccrmi::le_value(d));
              else
                ESP_LOGI("ccdump", "%s -> %s %u", ccrmi::path(cmd).c_str(), st == ccrmi::STATUS_ERROR ? "error" : "timeout",
                         d.empty() ? 0 : d[0]);
            }
            if (st != ccrmi::STATUS_OK || d.empty() || cmd[1] != 0x16 || cmd[2] != 0x01) return;
            const int32_t v = ccrmi::le_value(d);
            const float t = v / 10.0f;
            switch (cmd[4]) {
              case 2:  id(cc_auto_season).publish_state(v != 0); id(cc_climate).set_auto_season(v != 0); break;
              case 3:  if (v >= 0 && v <= 2) id(cc_season).publish_state(v == 0 ? "transition" : v == 1 ? "heating" : "cooling");
                       id(cc_climate).set_season(v); break;
              case 4:  id(cc_heating_knee_point).publish_state(t); break;
              case 5:  id(cc_cooling_knee_point).publish_state(t); break;
              case 8:  id(cc_auto_comfort).publish_state(v != 0); id(cc_climate).set_auto_comfort(v != 0); break;
              case 9:  id(cc_heating_comfort_temperature).publish_state(t); break;
              case 10: id(cc_cooling_comfort_temperature).publish_state(t); break;
              case 11: id(cc_cooling_temperature_limit).publish_state(t); break;
              case 12: id(cc_heating_reduction_delta).publish_state(t); break;
              case 13: id(cc_manual_temperature).publish_state(t); id(cc_climate).set_manual_temperature(t); break;
              case 15: id(cc_cooling_threshold).publish_state(t); break;
              case 16: id(cc_heating_threshold).publish_state(t); break;
              case 21: id(cc_heat_pump).publish_state(v == 0); id(cc_climate).set_heat_pump_enabled(v == 0); break;  // HYPOTHESIS: 0 = heat pump allowed
              case 29: if (v >= 0 && v <= 2) id(cc_temperature_profile).publish_state(v == 0 ? "comfort" : v == 1 ? "power" : "eco");
                       id(cc_climate).set_profile(v); break;
              default: break;
            }
          });
      - script.execute: cc_poll
<% endif %>

logger:
  level: INFO # sniffer logs at INFO with tag "sniff"
  logs:
    canbus: INFO

api:
  encryption:
    key: !secret ventilation_api_encryption_key
<% if clime %>
  # --- added: raw access for testing (Developer tools -> Actions -> esphome.<@ v.name | replace('-', '_') @>_comfoclime_*<% if suffix %>, with the MAC suffix in between<% endif %>) ---
  actions:
    # read any property of node 12, result in the log (tag ccdump)
    - action: comfoclime_get
      variables: {unit: int, subunit: int, prop: int}
      then:
        - lambda: |-
            id(cc_dump_left) += 1;
            ccrmi::client().get(unit, subunit, prop, true);
    # write 22/1/<prop> (TEMPCONFIG only), size 1 or 2 bytes; blocked unless writes are allowed
    - action: comfoclime_set
      variables: {prop: int, value: int, size: int}
      then:
        - lambda: "ccrmi::client().set(prop, value, size);"
<% endif %>

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_rrm: true
  enable_btm: true
  ap:
    password: !secret wifi_hotspot_password

captive_portal:
improv_serial:

<% if web %>
# ventilation.web_server: true. Own web page on port 80, only with the username and password from secrets.yaml.
# Basic auth over plain http: keep the device on a trusted (IoT) network.
web_server:
  port: 80
  ota: false
  local: true
  auth:
    username: !secret ventilation_web_username
    password: !secret ventilation_web_password

<% endif %>
dashboard_import:
  package_import_url: github://yoziru/esphome-zehnder-comfoair/zehnder-comfoair-q-m5stack-atoms3.dashboard.yml

zehnder_comfoair_q:
  id: comfoair
  request_ids:
    [16, 49, 54, 55, 65, 66, 67, 81, 82, 117, 118, 119, 120, 121, 122, 128, 129, 130,
     192, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 220, 221, 225, 227,
     274, 275, 276, 277, 278, 290, 291, 292, 293, 294,
     # added: ComfoCool PDOs (aiocomfoconnect PROTOCOL-PDO.md)
     85, 784, 785, 802]
  # NB: ComfoClime PDOs (41xx) are NOT requested: node 12 broadcasts them by itself
  # (on change + a full cycle roughly every 2 minutes; 4146 every second).

# ---------------------------------------------------------------------------
# From packages/canbus.yml @ ce62828 (identical) + sniffer on_frame + extra cases
# ---------------------------------------------------------------------------
canbus:
  - platform: esp32_can
    id: comfonet
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    bit_rate: 50kbps
    can_id: 0 # mandatory but we do not use it
    on_frame:
      # (1) upstream debug dump (only visible at logger level DEBUG)
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              auto data_pretty = remote_transmission_request ? "n/a" : format_hex_pretty(x).c_str();
              if ((can_id & 0b11111000000000011111111000000) == 0b00000000000000000000001000000)
              {
                ESP_LOGD("comfoair_dump", "Node: %ld, PDO: %ld, rtr: %d, length: %d, content: %s (can_id: 0x%08lx)", can_id & 0x3f, can_id >> 14, remote_transmission_request, x.size(), data_pretty, can_id);
              }
              else
              {
                ESP_LOGV("comfoair_dump", "can_id: 0x%08lx, rtr: %d, length: %d, content: %s", can_id, remote_transmission_request, x.size(), data_pretty);
              }
      # (2) upstream PDO decoder (PDO 0..1023) + ComfoCool cases
      - can_id: 0b00000000000000000000001000000
        can_id_mask: 0b11111000000000011111111000000
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              auto pdo_id = id(comfoair)->get_pdo_id_from_can_id (can_id); // need space for ESPHome not to try to interpret it as id(...)
              switch (pdo_id)
              {
                  comfoair_on_frame_case( 16, id(comfoair), away_indicator_raw,                true);
                  comfoair_on_frame_case( 49, id(comfoair), operating_mode,                    true);
                  comfoair_on_frame_case( 54, id(comfoair), supply_fan_mode,                   true);
                  comfoair_on_frame_case( 55, id(comfoair), exhaust_fan_mode,                  true);
                  comfoair_on_frame_case( 65, id(comfoair), fan_level_raw,                     true);
                  comfoair_on_frame_case( 66, id(comfoair), bypass_activation_mode,            true);
                  comfoair_on_frame_case( 67, id(comfoair), temperature_profile,                true);
                  comfoair_on_frame_case( 81, id(comfoair), next_fan_change_in_raw,           false);
                  comfoair_on_frame_case( 82, id(comfoair), next_bypass_change_in_raw,        false);
                  comfoair_on_frame_case(117, id(comfoair), exhaust_fan_duty,                 false);
                  comfoair_on_frame_case(118, id(comfoair), supply_fan_duty,                  false);
                  comfoair_on_frame_case(119, id(comfoair), exhaust_fan_flow,                  false);
                  comfoair_on_frame_case(120, id(comfoair), supply_fan_flow,                   false);
                  comfoair_on_frame_case(121, id(comfoair), exhaust_fan_speed,                 true);
                  comfoair_on_frame_case(122, id(comfoair), supply_fan_speed,                  true);
                  comfoair_on_frame_case(128, id(comfoair), power,                             true);
                  comfoair_on_frame_case(129, id(comfoair), energy_ytd,                        true);
                  comfoair_on_frame_case(130, id(comfoair), energy_since_start,                true);
                  comfoair_on_frame_case(192, id(comfoair), filter_replacement_remaining_days, false);
                  comfoair_on_frame_case(209, id(comfoair), running_mean_outdoor_temp,        false);
                  comfoair_on_frame_case(210, id(comfoair), heating_season_raw,                true);
                  comfoair_on_frame_case(211, id(comfoair), cooling_season_raw,                true);
                  comfoair_on_frame_case(212, id(comfoair), profile_target_temp,               false);
                  comfoair_on_frame_case(213, id(comfoair), avoided_heating_actual,            true);
                  comfoair_on_frame_case(214, id(comfoair), avoided_heating_ytd,               true);
                  comfoair_on_frame_case(215, id(comfoair), avoided_heating_total,             true);
                  comfoair_on_frame_case(216, id(comfoair), avoided_cooling_actual,            true);
                  comfoair_on_frame_case(217, id(comfoair), avoided_cooling_ytd,               true);
                  comfoair_on_frame_case(218, id(comfoair), avoided_cooling_total,             true);
                  comfoair_on_frame_case(220, id(comfoair), pre_heater_temp_before,           false);
                  comfoair_on_frame_case(221, id(comfoair), post_heater_temp_after,           false);
                  comfoair_on_frame_case(225, id(comfoair), ventilation_mode,                  true);
                  comfoair_on_frame_case(227, id(comfoair), bypass_state,                      true);
                  comfoair_on_frame_case(274, id(comfoair), extract_air_temp,                 false);
                  comfoair_on_frame_case(275, id(comfoair), exhaust_air_temp,                 false);
                  comfoair_on_frame_case(276, id(comfoair), outdoor_air_temp,                 false);
                  comfoair_on_frame_case(277, id(comfoair), pre_heater_temp_after,            false);
                  comfoair_on_frame_case(278, id(comfoair), supply_air_temp,                  false);
                  comfoair_on_frame_case(290, id(comfoair), extract_air_humidity,              true);
                  comfoair_on_frame_case(291, id(comfoair), exhaust_air_humidity,              true);
                  comfoair_on_frame_case(292, id(comfoair), outdoor_air_humidity,              true);
                  comfoair_on_frame_case(293, id(comfoair), pre_heater_humidity_after,         true);
                  comfoair_on_frame_case(294, id(comfoair), supply_air_humidity,               true);
                  // --- added: ComfoCool (aiocomfoconnect PROTOCOL-PDO.md) ---
                  comfoair_on_frame_case( 85, id(comfoair), comfocool_next_change_raw,         true);
                  comfoair_on_frame_case(784, id(comfoair), comfocool_state_raw,               true);
                  comfoair_on_frame_case(785, id(comfoair), comfocool_compressor_raw,          true);
                  comfoair_on_frame_case(802, id(comfoair), comfocool_condensor_temp,         false);
              }
<% if clime %>
      # (3) ComfoClime 24 decoder: PDOs broadcast by ComfoNet node 12.
      #     can_id = PDO<<14 | 0x40 | 12 -> the low 14 bits are always 0x004C for a node-12 PDO
      #     (RMI frames have bit 12 set and heartbeats lack the 0x40 marker, so they never match).
      #     Receive-only. Little-endian; types/scales verified byte-for-byte against the
      #     ComfoClime REST API (/device/<uuid>/telemetry/<id>); see LOGIC.md of the kit module.
      - can_id: 0x0000004C
        can_id_mask: 0x00003FFF
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: |-
              if ((can_id >> 24) == 0x1f) return;  // safety: never treat RMI as PDO
              const uint16_t pdo = (can_id >> 14) & 0x7fff;
              const size_t n = x.size();
              auto u8  = [&]() -> float { return (float) x[0]; };
              auto s16 = [&]() -> float { return (float) (int16_t) (x[0] | (x[1] << 8)); };
              auto u16 = [&]() -> float { return (float) (uint16_t) (x[0] | (x[1] << 8)); };
              auto u32 = [&]() -> float { return (float) (uint32_t) (x[0] | (x[1] << 8) | (x[2] << 16) | ((uint32_t) x[3] << 24)); };
              switch (pdo) {
                // --- certain ---
                case 4145: if (n >= 2) id(comfoclime_tpma_temperature).publish_state(s16() / 10.0f); break;
                case 4146: if (n >= 4) id(comfoclime_uptime).publish_state(u32()); break;
                case 4148: if (n >= 2) {
                    const float v = s16() / 10.0f;
                    if (v != id(comfoclime_target_temperature).state) {  // setpoint changed -> re-read the settings behind it
                      ccrmi::client().get(0x16, 1, 13); ccrmi::client().get(0x16, 1, 8); ccrmi::client().get(0x16, 1, 29);
                    }
                    id(comfoclime_target_temperature).publish_state(v);
                    id(cc_climate).set_setpoint(v);
                  } break;
                case 4149: if (n >= 1) {
                    const uint8_t m = x[0];
                    if (m != id(comfoclime_mode_raw).state) { ccrmi::client().get(0x16, 1, 3); ccrmi::client().get(0x16, 1, 2); }
                    id(cc_climate).set_active_mode(m);
                    id(comfoclime_mode_raw).publish_state(m);
                    const char *s = m == 0 ? "Off/Transition" : m == 1 ? "Heating" : m == 2 ? "Cooling" : "Unknown";
                    if (id(comfoclime_mode).state != s) id(comfoclime_mode).publish_state(s);
                  } break;
                case 4151: if (n >= 2) id(comfoclime_comfort_temperature).publish_state(s16() / 10.0f); break;
                case 4154: if (n >= 2) { id(comfoclime_indoor_temperature).publish_state(s16() / 10.0f); id(cc_climate).set_indoor_temperature(s16() / 10.0f); } break;
                case 4193: if (n >= 2) id(comfoclime_supply_air_temperature).publish_state(s16() / 10.0f); break;
                case 4201: if (n >= 2) id(comfoclime_heat_pump_power).publish_state(u16()); break;
                case 4192: if (n >= 2) { id(comfoclime_heat_pump_status).publish_state(u16()); id(cc_climate).set_heat_pump_status((int) u16()); } break;
                // --- probable ---
                case 4194: if (n >= 2) id(comfoclime_exhaust_air_temperature).publish_state(s16() / 10.0f); break;
                case 4195: if (n >= 2) id(comfoclime_supply_coil_temperature).publish_state(s16() / 10.0f); break;
                case 4196: if (n >= 2) id(comfoclime_exhaust_coil_temperature).publish_state(s16() / 10.0f); break;
                case 4197: if (n >= 2) id(comfoclime_compressor_temperature).publish_state(s16() / 10.0f); break;
                case 4198: if (n >= 1) id(comfoclime_heat_pump_modulation).publish_state(u8()); break;
                // --- unknown meaning (raw values, disabled by default) ---
                case 4152: if (n >= 2) id(comfoclime_raw_4152).publish_state(s16() / 10.0f); break;
                case 4153: if (n >= 2) id(comfoclime_raw_4153).publish_state(s16()); break;
                case 4202: if (n >= 2) id(comfoclime_raw_4202).publish_state(s16() / 10.0f); break;
                case 4203: if (n >= 2) id(comfoclime_raw_4203).publish_state(s16()); break;
                case 4205: if (n >= 2) id(comfoclime_raw_4205).publish_state(s16()); break;
                case 4206: if (n >= 2) id(comfoclime_raw_4206).publish_state(s16()); break;
                case 4207: if (n >= 2) id(comfoclime_raw_4207).publish_state(s16()); break;
                case 4208: if (n >= 2) id(comfoclime_raw_4208).publish_state(s16()); break;
                case 4211: if (n >= 2) id(comfoclime_raw_4211).publish_state(s16()); break;
                default: break;
              }
      # (3b) ComfoClime RMI responses: node 12 -> node 62 (this board). Low 12 bits = 62<<6 | 12.
      - can_id: 0x1F000F8C
        can_id_mask: 0x1F000FFF
        use_extended_id: true
        remote_transmission_request: false
        then:
          - lambda: "ccrmi::client().handle_frame(can_id, x);"
<% endif %>
<% if sniffer %>
      # (4) Rate-limited sniffer: logs frames that neither the package nor the ComfoClime
      #     decoder handles (budget 50 lines, re-armable), plus a summary every 60 s.
      - can_id: 0
        can_id_mask: 0
        use_extended_id: true
        then:
          - lambda: |-
              if (!id(sniff_enabled)) return;
              static const std::set<uint16_t> known = {16,49,54,55,65,66,67,81,82,117,118,119,120,121,122,128,129,130,
                192,209,210,211,212,213,214,215,216,217,218,220,221,225,227,274,275,276,277,278,290,291,292,293,294,
                85,784,785,802};
              static const std::set<uint16_t> known_clime = {4145,4146,4148,4149,4151,4154,4193,4201,4192,4194,4195,
                4196,4197,4198,4152,4153,4202,4203,4205,4206,4207,4208,4211};
              static uint32_t n_total = 0, n_known = 0, n_pdo = 0, n_req = 0, n_rmi = 0, n_hb = 0, n_other = 0;
              static std::map<uint8_t, uint32_t> per_node;
              static uint32_t last_sum = 0;
              n_total++;
              const uint8_t node = can_id & 0x3f;
              per_node[node]++;
              const bool is_rmi = (can_id >> 24) == 0x1f;
              const bool is_hb  = (can_id & 0x1fffffc0) == 0x10000000;
              const bool is_pdo = !is_rmi && !is_hb && (((can_id >> 6) & 0xff) == 0x01);
              const uint16_t pdo = is_pdo ? ((can_id >> 14) & 0x7fff) : 0;
              const char *kind = "OTHER";
              bool log_it = true;
              if (is_pdo) {
                if (remote_transmission_request) { n_req++; kind = "PDO-REQ"; }
                else { n_pdo++; kind = "PDO"; }
                if (known.count(pdo) || (node == 12 && known_clime.count(pdo))) { n_known++; log_it = false; }
              } else if (is_hb) { n_hb++; kind = "HEARTBEAT"; log_it = (per_node[node] <= 1); }
              else if (is_rmi) { n_rmi++; kind = "RMI"; log_it = id(sniff_rmi); }
              else { n_other++; }
              if (log_it && id(sniff_budget) > 0) {
                id(sniff_budget) -= 1;
                ESP_LOGI("sniff", "%s node=%u pdo=%u can_id=0x%08lx rtr=%d len=%u data=[%s]", kind, node, pdo,
                         (unsigned long) can_id, remote_transmission_request ? 1 : 0, (unsigned) x.size(),
                         format_hex_pretty(x).c_str());
              }
              if (millis() - last_sum > 60000) {
                last_sum = millis();
                std::string nodes;
                for (auto &kv : per_node) { char b[24]; snprintf(b, sizeof(b), "%u:%lu ", kv.first, (unsigned long) kv.second); nodes += b; }
                ESP_LOGI("sniffsum", "total=%lu known=%lu PDO=%lu PDO-REQ=%lu RMI=%lu HB=%lu OTHER=%lu budget=%d | per node: %s",
                         (unsigned long) n_total, (unsigned long) n_known, (unsigned long) n_pdo, (unsigned long) n_req,
                         (unsigned long) n_rmi, (unsigned long) n_hb, (unsigned long) n_other, id(sniff_budget), nodes.c_str());
                id(sniff_unique_count) = per_node.size();
              }
<% endif %>

<% if sniffer or clime %>
# ---------------------------------------------------------------------------
# Sniffer state + controls
# ---------------------------------------------------------------------------
globals:
<% if sniffer %>
  - id: sniff_budget
    type: int
    restore_value: false
    initial_value: "50"
  - id: sniff_enabled
    type: bool
    restore_value: false
    initial_value: "true"
